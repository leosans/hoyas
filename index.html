onths.":"Regue com moderação e deixe o substrato secar quase por completo, a cada 10-14 dias mais ou menos nos meses frios.","2–3 times a season":"2–3 vezes por temporada","Bell-shaped flowers up to 5 cm across, from white to deep pink and red, 5-15 per umbel. Each one lasts about 2 weeks.":"Flores em forma de sino de até 5 cm, do branco ao rosa intenso e vermelho, 5-15 por umbela. Cada uma dura cerca de 2 semanas.","Gardenia":"Gardênia","Gardenia-like scent":"Perfume parecido com gardênia","Large, thick and very hard leaves, about 12-16 cm long, with a prominent midrib and no silver flecks. New leaves come in reddish brown and turn glossy dark green.":"Folhas grandes, grossas e muito duras, com cerca de 12-16 cm de comprimento, nervura central saliente e sem pintas prateadas. As folhas novas nascem marrom-avermelhadas e ficam verde-escuras e brilhantes.","Warm and humid; it dislikes the cold.":"Quente e úmido; não gosta de frio.","Bright indirect light, about 10,000-20,000 lux. It bloomed under 12 hours of grow light a day.":"Luz indireta forte, cerca de 10.000-20.000 lux. Floresceu com 12 horas de luz de cultivo por dia.","Keep it barely moist through the growing season, watering when the mix is 60-80% dry. Keep it drier in winter, as in its lowland monsoon home.":"Mantenha levemente úmida durante a fase de crescimento, regando quando o substrato estiver 60-80% seco. No inverno, mantenha mais seca, como no seu habitat de baixada com monções.","About 2 years to first bloom":"Cerca de 2 anos até a primeira floração","White star flowers with a red-centered pale rose corona, 10-40 per umbel, lasting about a week. Subspecies tenuipes blooms often; subspecies australis is more reluctant.":"Flores brancas em estrela com corona rosa-clara de centro vermelho, 10-40 por umbela, durando cerca de uma semana. A subespécie tenuipes floresce com frequência; a subespécie australis é mais relutante.","No humidity data":"Sem dados de umidade","Spicy":"Picante","Spicy scent that can be overpowering with several umbels open":"Perfume picante que pode ficar intenso demais com várias umbelas abertas","Shiny, succulent, elliptic to ovate leaves up to about 6 cm long. Yellowish green in sun, darker green in shade.":"Folhas brilhantes e suculentas, elípticas a ovais, de até cerca de 6 cm. Verde-amareladas no sol, verde mais escuro na sombra.","A damaged plant bleeds a white sap that is toxic, so keep it away from pets and wash your hands after pruning.":"Quando danificada, a planta solta uma seiva branca tóxica, então mantenha longe de animais e lave as mãos depois de podar.","Bright indirect light, and it welcomes some direct sun early in the morning or late in the afternoon.":"Luz indireta forte, e aceita bem um pouco de sol direto no começo da manhã ou no fim da tarde.","Low to medium. The succulent leaves store water, so on average water about every 10 days.":"Pouca a moderada. As folhas suculentas armazenam água, então, em média, regue a cada 10 dias mais ou menos.","Site page is for the variegated form 'Lisa'":"A página do site é da forma variegada 'Lisa'","Green-yellow flowers with a bright orange center. They drip a lot of nectar.":"Flores verde-amareladas com centro laranja vivo. Pingam bastante néctar.","No scent data":"Sem dados de perfume","Broad, leathery, somewhat heart-shaped leaves up to about 15 cm across, with a pointed tip and slight dimpling.":"Folhas largas e coriáceas, um pouco em forma de coração, de até cerca de 15 cm, com ponta aguda e leves covinhas.","Becomes a very large plant. Keep it above 12ºC in winter.":"Vira uma planta muito grande. Mantenha acima de 12ºC no inverno.","Bright, filtered light.":"Luz forte e filtrada.","Water about weekly, without letting it dry out completely.":"Regue mais ou menos uma vez por semana, sem deixar secar por completo.","About 20 months from cutting to flower":"Cerca de 20 meses da estaca até a flor","White porcelain stars with a rose-pink corona, about 9 per umbel. Flowers last about 8 days, make no nectar, and the plant drops its peduncles after flowering.":"Estrelas brancas de porcelana com corona rosa, cerca de 9 por umbela. As flores duram cerca de 8 dias, não produzem néctar, e a planta solta os pedúnculos depois de florir.","Honey":"Mel","Fresh":"Fresco","Sweet honey scent; others describe it as fresh":"Perfume doce de mel; outros o descrevem como fresco","Small lance-shaped leaves about 2-3 cm long, light green, waxy and slightly succulent.":"Folhas pequenas lanceoladas, com cerca de 2-3 cm, verde-claras, cerosas e levemente suculentas.","Best grown hanging. If moisture is inconsistent the leaves can pit, yellow and drop. It is prone to root rot; if it happens, restart it from cuttings.":"Fica melhor pendente. Se a umidade for irregular, as folhas podem ficar marcadas, amarelar e cair. É propensa a podridão das raízes; se acontecer, recomece por estacas.","Bright indirect light.":"Luz indireta forte.","Likes more water than most Hoyas, especially while blooming: keep it evenly moist, but never soggy. A self-watering pot works well.":"Gosta de mais água que a maioria das Hoyas, principalmente quando está florindo: mantenha o substrato uniformemente úmido, mas nunca encharcado. Um vaso autoirrigável funciona bem.","Cup-shaped, soft yellow flowers on long peduncles up to 12 cm, 10-25 per umbel. Each flower lasts a couple of days.":"Flores em forma de taça, amarelo-suave, em pedúnculos longos de até 12 cm, 10-25 por umbela. Cada flor dura uns dois dias.","None":"Nenhum","Almost no scent":"Quase sem perfume","Long, narrow dagger-shaped leaves, usually 9-12 cm long and 2.5-3 cm wide. Medium green with lighter veins, hard and slightly rough, reddening in sun.":"Folhas longas e estreitas em forma de punhal, geralmente com 9-12 cm de comprimento e 2,5-3 cm de largura. Verde médio com nervuras mais claras, duras e um pouco ásperas, avermelhando no sol.","A twining or trailing vine.":"Uma trepadeira volúvel ou pendente.","Bright, indirect light.":"Luz indireta forte.","Likes plenty of water. Water when the surface feels dry and don't let it dry out much.":"Gosta de bastante água. Regue quando a superfície estiver seca ao toque e não deixe secar muito.","All year":"O ano todo","Blooms easily":"Floresce com facilidade","Small cup-shaped flowers, very short-lived, lasting a couple of days.":"Flores pequenas em forma de taça, de vida muito curta, durando uns dois dias.","Little or no scent":"Pouco ou nenhum perfume","Deep green leaves that vary a lot, from long narrow lances to small ellipses, often with cream or light green veins. Can redden in strong light.":"Folhas verde-escuras muito variáveis, de lanças longas e estreitas a pequenas elipses, muitas vezes com nervuras creme ou verde-claras. Podem avermelhar com luz forte.","Low maintenance. Fertilize at every watering. Warm days around 27-28ºC with nights near 14ºC suit it.":"Pouca manutenção. Adube a cada rega. Dias quentes, por volta de 27-28ºC, e noites perto de 14ºC lhe fazem bem.","Grows under grow lights or on a windowsill in normal house conditions. It stays green even in full sun.":"Cresce sob luz de cultivo ou no parapeito da janela, nas condições normais de uma casa. Continua verde mesmo no sol pleno.","About once a week; it drinks more than you would expect.":"Mais ou menos uma vez por semana; bebe mais do que se imagina.","Most of the year indoors":"Boa parte do ano dentro de casa","Deep green leaves that vary a lot, from long narrow lances to small ellipses, often with cream or light green veins.":"Folhas verde-escuras muito variáveis, de lanças longas e estreitas a pequenas elipses, muitas vezes com nervuras creme ou verde-claras.","Salmon-pink flowers, reflexed rather than cup-shaped, 15-30 per cluster, lasting a few days.":"Flores rosa-salmão, reflexas em vez de em forma de taça, 15-30 por cacho, durando alguns dias.","Long, narrow leaves like the other blashernaezii forms, turning red in sun.":"Folhas longas e estreitas como as das outras formas de blashernaezii, ficando vermelhas no sol.","Bright, indirect light. The leaves turn red in sun.":"Luz indireta forte. As folhas ficam vermelhas no sol.","Water when the surface is dry to the touch.":"Regue quando a superfície estiver seca ao toque.","Shiny, cup-shaped ivory flowers, 2-3 cm across, with a plum-centered corona and 10-20 per umbel. They last about a week.":"Flores cor de marfim, brilhantes e em forma de taça, de 2-3 cm, com corona de centro cor de ameixa e 10-20 por umbela. Duram cerca de uma semana.","Lemon":"Limão","Pleasant lemon-like scent. Noticeable up close; also described as lemongrass":"Perfume agradável parecido com limão. Perceptível de perto; também descrito como capim-limão","Thin, delicate dark green leaves with a few spots, about 9-12 cm long and 4-5 cm wide.":"Folhas finas e delicadas, verde-escuras, com algumas manchas, de cerca de 9-12 cm de comprimento e 4-5 cm de largura.","Likes it really warm and humid. Easy to root despite its thin leaves. Formerly sold as H. cystiantha.":"Gosta de muito calor e umidade. Enraíza fácil apesar das folhas finas. Antes era vendida como H. cystiantha.","Bright, warm conditions; it flowers better with more sun.":"Condições quentes e claras; floresce melhor com mais sol.","Keep it lightly moist.":"Mantenha levemente úmida.","The year after arriving as a cutting":"No ano seguinte à chegada como estaca","Tiny pink flowers with a yellow center in balls of 20-25. They open in the morning, close at night and last only 1-2 days, with no nectar.":"Flores minúsculas cor-de-rosa com centro amarelo em bolas de 20-25. Abrem de manhã, fecham à noite e duram só 1-2 dias, sem néctar.","Unpleasant":"Desagradável","Musky and unpleasant":"Almiscarado e desagradável","Ovate, pointed leaves about 7-10 cm long with clear pale veins. Can pick up red spots in full sun.":"Folhas ovais e pontudas, com cerca de 7-10 cm, de nervuras claras e bem visíveis. Podem ganhar manchas vermelhas no sol pleno.","Easy and fast to grow and flower. Twining: give it a trellis or let it trail.":"Fácil e rápida de cultivar e de florir. Volúvel: dê a ela uma treliça ou deixe pender.","Very free-flowering":"Floresce com muita facilidade","Clusters of 20-30 pinkish-white flowers with a red-ringed corona, rich in nectar and lasting about a week. It blooms heavily when trellised or in a basket.":"Cachos de 20-30 flores branco-rosadas com corona de anel vermelho, ricas em néctar e durando cerca de uma semana. Floresce em abundância na treliça ou em cesto suspenso.","Chocolate-like scent":"Perfume parecido com chocolate","Japan":"Japão","Thick, fleshy, glossy leaves about 6-11 cm long, usually with silver flecks. New leaves can come in red before turning green.":"Folhas grossas, carnudas e brilhantes, com cerca de 6-11 cm, geralmente com pintas prateadas. As folhas novas podem nascer vermelhas antes de ficarem verdes.","A vigorous twining climber that can stay in the same pot for years. Watch for flat mites.":"Trepadeira volúvel vigorosa que pode ficar anos no mesmo vaso. Fique de olho nos ácaros-planos.","A north window keeps it green with larger leaves, but it needs a brighter spot to flower.":"Uma janela voltada ao norte a mantém verde e com folhas maiores, mas ela precisa de um lugar mais claro para florir.","Tolerates neglect; overwatering is the main risk. Treat it almost like a succulent in winter.":"Tolera descuido; o maior risco é regar demais. No inverno, trate quase como uma suculenta.","Lightly felted white to pale lemon stars with a matching corona, up to 25 per umbel, lasting about a week. It can bloom within 6 months of rooting. The first peduncle dropped off; it flowered on the second.":"Estrelas levemente feltradas, do branco ao limão-claro, com corona do mesmo tom, até 25 por umbela, durando cerca de uma semana. Pode florir até 6 meses depois de enraizar. O primeiro pedúnculo caiu; floresceu no segundo.","Clove-like scent":"Perfume parecido com cravo","Luzon (Philippines)":"Luzon (Filipinas)","Hanging from trees along the shore":"Pendurada em árvores ao longo da costa","Thick, smooth light green leaves, long and narrow, usually without flecks. Can reach about 18 cm.":"Folhas grossas, lisas e verde-claras, longas e estreitas, geralmente sem pintas. Podem chegar a cerca de 18 cm.","If growth stalls, repot and add some moisture-retaining peat. Formerly sold as H. pubicalyx 'White Dragon'.":"Se o crescimento parar, troque o vaso e acrescente um pouco de turfa para reter umidade. Antes era vendida como H. pubicalyx 'White Dragon'.","Bright, indirect light. It started budding after moving under grow lights in fall.":"Luz indireta forte. Começou a formar botões depois de ir para baixo da luz de cultivo no outono.","Prefers a mix that holds some moisture.":"Prefere um substrato que retenha um pouco de umidade.","Velvety light green-yellow flowers with a matching corona, up to 15 per umbel, lasting about a week (up to 10 days), with nectar.":"Flores aveludadas verde-amarelo-claras com corona do mesmo tom, até 15 por umbela, durando cerca de uma semana (até 10 dias), com néctar.","Bubble gum":"Chiclete","Mild bubble gum scent":"Perfume suave de chiclete","Narrow dark green leaves with sharp points, about 4-10 cm long, with a prominent center vein.":"Folhas estreitas verde-escuras de pontas agudas, com cerca de 4-10 cm, com nervura central saliente.","Slow and considered hard to grow, so not for average growers. Hang it or give it a support. Kew now files it under H. betchei.":"Lenta e considerada difícil de cultivar, então não é para quem está começando. Deixe pendente ou dê a ela um suporte. Kew agora a classifica como H. betchei.","Medium to bright indirect light.":"Luz indireta média a forte.","Keep it moderately moist.":"Mantenha moderadamente úmida.","After a long struggle":"Depois de muita luta","Site page is H. filiformis aka H. chlorantha var. tutuilensis name disputed":"A página do site é de H. filiformis, também chamada H. chlorantha var. tutuilensis (nome contestado)","Few blooms, but an unusual color combination: lime-green flowers with a dark purple corona, 20-30 per umbel, lasting about a week, with some nectar.":"Poucas florações, mas uma combinação de cores incomum: flores verde-limão com corona roxo-escura, 20-30 por umbela, durando cerca de uma semana, com um pouco de néctar.","Big dark green leaves, about 11-15 cm long, with raised paler veins running along the blade. Smooth, with very few flecks.":"Folhas grandes verde-escuras, com cerca de 11-15 cm, com nervuras mais claras e em relevo ao longo da lâmina. Lisas, com pouquíssimas pintas.","Hard to grow; it needed several restarts. It often drops one leaf per node, so the foliage fills in slowly. A twiner for a large support. Kew now files it under H. macrophylla.":"Difícil de cultivar; precisou recomeçar várias vezes. Costuma perder uma folha por nó, então a folhagem demora a encher. Volúvel, para um suporte grande. Kew agora a classifica como H. macrophylla.","Very sensitive to overwatering.":"Muito sensível ao excesso de água.","Few blooms, but an unusual color combination: purple-violet flowers, 20-30 per umbel, lasting about a week, with some nectar.":"Poucas florações, mas uma combinação de cores incomum: flores roxo-violeta, 20-30 por umbela, durando cerca de uma semana, com um pouco de néctar.","Medium to large leaves with clearly visible three-nerved veining and some flecks.":"Folhas médias a grandes, com três nervuras bem visíveis e algumas pintas.","Hard to grow; it needed several restarts. It drops fewer leaves than the plain form. A twiner for a large support.":"Difícil de cultivar; precisou recomeçar várias vezes. Perde menos folhas que a forma comum. Volúvel, para um suporte grande.","Site page is for the species in general":"A página do site é da espécie em geral","Thick, waxy flowers from white to pinkish-red. A shy bloomer that needs to reach a good size first. Don't prune the old flower spurs.":"Flores grossas e cerosas, do branco ao vermelho-rosado. Floresce pouco e precisa atingir um bom tamanho antes. Não pode os esporões das flores antigas.","Musky scent at night":"Perfume almiscarado à noite","Malaya":"Malásia Peninsular","Thick, rounded and velvety green leaves.":"Folhas verdes grossas, arredondadas e aveludadas.","A climber up to about 5 m. Its latex can irritate the skin.":"Trepadeira de até cerca de 5 m. O látex pode irritar a pele.","Strong light; it tolerates direct sun well, though very strong sun can turn the leaves yellow. It also copes with partial shade.":"Luz forte; tolera bem o sol direto, embora sol muito forte possa amarelar as folhas. Também se vira na meia-sombra.","Moderate; it handles dryness better than too much water.":"Moderada; lida melhor com a seca do que com água demais.","At most once a month, often with months of rest":"No máximo uma vez por mês, muitas vezes com meses de descanso","MyBIS (Malaysia Biodiversity)":"MyBIS (Biodiversidade da Malásia)","Fuzzy reflexed flowers on tiny peduncles, up to 30 per umbel, lasting about 5 days. Slow and difficult to bloom; it took the author about 3 years to get right.":"Flores reflexas e peludas em pedúnculos minúsculos, até 30 por umbela, durando cerca de 5 dias. Lenta e difícil de florir; o autor levou cerca de 3 anos para acertar.","Fragrant":"Perfumada","Fragrant; a vague. Pleasant scent that is hard to describe":"Perfumada; um perfume vago e agradável, difícil de descrever","Tiny, thick succulent leaves, round with a pointed tip, olive green mottled with gray. Forms a dense mat.":"Folhas minúsculas, grossas e suculentas, redondas com ponta aguda, verde-oliva mesclado de cinza. Forma um tapete denso.","Best grown hanging. Enjoys daily misting.":"Fica melhor pendente. Gosta de borrifadas diárias.","Very bright light helps it bloom; the author moved it around the house to follow the sun.":"Luz bem forte ajuda a florir; o autor a mudava de lugar pela casa para acompanhar o sol.","Dislikes staying wet: let it dry out, then soak it thoroughly.":"Não gosta de ficar molhada: deixe secar e depois encharque bem.","Buds take 10+ weeks to open":"Os botões levam mais de 10 semanas para abrir","Glossy ivory porcelain-like stars with a red-centered corona, up to 15 per umbel, lasting about 3 days.":"Estrelas cor de marfim, brilhantes como porcelana, com corona de centro vermelho, até 15 por umbela, durando cerca de 3 dias.","Sweet and spicy scent":"Perfume doce e picante","Biliran Islands":"Ilhas Biliran","Visayas (Philippines)":"Visayas (Filipinas)","Opposite, leathery leaves, glossy above, with some visible veins. Similar in shape to camphorifolia.":"Folhas opostas e coriáceas, brilhantes em cima, com algumas nervuras visíveis. De forma parecida com a da camphorifolia.","An easy grower that does well in a grow tent. Endemic to Samar and Biliran in the Philippines, published in 2013.":"Fácil de cultivar e vai bem numa estufa de cultivo. Endêmica de Samar e Biliran, nas Filipinas, descrita em 2013.","Very little: about every 10 days, judging by the weight of the pot.":"Muito pouca: a cada 10 dias mais ou menos, pelo peso do vaso.","Early and often, within 3 months of potting":"Cedo e com frequência, até 3 meses depois de envasar","Very large waxy flowers, about 5 cm across, in yellow and pinkish-orange tones, up to 8 per umbel, lasting up to 10 days. Easy to bloom for its group.":"Flores cerosas bem grandes, com cerca de 5 cm, em tons de amarelo e laranja-rosado, até 8 por umbela, durando até 10 dias. Fácil de florir para o seu grupo.","Pleasant spicy scent":"Perfume picante agradável","Hybrid of Hoya 'MM' x H":"Híbrido de Hoya 'MM' x H","By Ed Gilding. Sussuela":"Por Ed Gilding. Sussuela","Shiny, smooth leaves.":"Folhas brilhantes e lisas.","Very cold-sensitive; best kept warm or in a greenhouse. Fast-growing in warm months, it gets large and long-vined and needs space. Not for beginners.":"Muito sensível ao frio; melhor em lugar quente ou numa estufa. Cresce rápido nos meses quentes, fica grande, com ramas longas, e precisa de espaço. Não é para iniciantes.","Very bright filtered light or bright shade, and it tolerates full sun. It blooms best with more light.":"Luz filtrada bem forte ou sombra clara, e tolera sol pleno. Floresce melhor com mais luz.","Likes more water than the average succulent Hoya, but never soggy. Water less in winter.":"Gosta de mais água que a Hoya suculenta média, mas nunca encharcada. Regue menos no inverno.","White flowers that start as a closed, cage-like ball (the name means 'to trap'), up to 10 per umbel, on peduncles at every leaf node. Open flowers last about 8 days; the caged form lasts up to 20.":"Flores brancas que começam como uma bola fechada, parecida com uma gaiola (o nome quer dizer 'aprisionar'), até 10 por umbela, em pedúnculos em todos os nós. As flores abertas duram cerca de 8 dias; a forma fechada dura até 20.","Sumatra (Indonesia)":"Sumatra (Indonésia)","On bamboo in hill forest around 780 m":"Sobre bambu em floresta de encosta, a cerca de 780 m","Thin leaves on a shrubby epiphyte.":"Folhas finas numa epífita arbustiva.","An epiphytic shrub that improves with age. Prune it to make it branch.":"Um arbusto epífito que melhora com a idade. Pode para que ramifique.","Bright, warm conditions.":"Condições quentes e claras.","Its thin leaves need a fair amount of water. Don't let the mix dry out, or new leaves turn pale.":"As folhas finas precisam de bastante água. Não deixe o substrato secar, ou as folhas novas ficam pálidas.","About 3 months after moving into a warm, humid tent":"Cerca de 3 meses depois de ir para uma estufa quente e úmida","White flowers with a large, glossy red-centered corona, 5-30 in ball-shaped umbels that often point up. They last 5-7 days, with plenty of clear nectar.":"Flores brancas com corona grande e brilhante de centro vermelho, 5-30 em umbelas em forma de bola que muitas vezes apontam para cima. Duram 5-7 dias, com bastante néctar transparente.","No temperature data":"Sem dados de temperatura","Fruity":"Frutado","Rounded green leaves with a white vein network that looks like a turtle shell, sometimes with silver flecks. Marks easily if sprayed.":"Folhas verdes arredondadas com uma rede de nervuras brancas que lembra um casco de tartaruga, às vezes com pintas prateadas. Mancha fácil se borrifada.","Considered difficult, but very beautiful.":"Considerada difícil, mas muito bonita.","Bright, filtered light. It recovered and bloomed under grow lights.":"Luz forte e filtrada. Se recuperou e floresceu sob luz de cultivo.","Subtle scent: sweet to some, unnoticeable to others":"Perfume sutil: doce para alguns, imperceptível para outros","A subtle scent: sweet to some":"Um perfume sutil: doce para alguns","Johor (Malaysia)":"Johor (Malásia)","Shady riverbanks. Rare and endangered":"Margens sombreadas de rios. Rara e ameaçada","Small, thick, almost round leaves, about 3 cm long, light to olive green with wavy, rippled edges, with no creases or visible veins.":"Folhas pequenas, grossas, quase redondas, com cerca de 3 cm, de verde-claro a verde-oliva, com bordas onduladas e franzidas, sem vincos nem nervuras visíveis.","Mostly vining. Feed it with a seaweed-based fertilizer. Not for beginners; it needs a tent or terrarium. Often sold wrongly as H. kanyakumariana.":"Na maior parte trepadeira. Adube com fertilizante à base de algas. Não é para iniciantes; precisa de estufa ou terrário. Muitas vezes vendida por engano como H. kanyakumariana.","No light data":"Sem dados de luz","Grown in a tent under LED and T-5 lights plus a small HPS light.":"Cultivada numa estufa sob luzes LED e T-5, mais uma pequena lâmpada HPS.","Tricky: watering at the wrong time can make a developing peduncle drop.":"Delicada: regar na hora errada pode fazer um pedúnculo em formação cair.","Buds open about a month after appearing":"Os botões abrem cerca de um mês depois de aparecer","White porcelain stars with a pink center, up to 4 per umbel, very like H. bella. They last about 8 days.":"Estrelas brancas de porcelana com centro rosa, até 4 por umbela, muito parecidas com H. bella. Duram cerca de 8 dias.","Vietnam":"Vietnã","Misty mountains":"Montanhas enevoadas","Among the smallest leaves in the genus, tiny, narrow and green. Yellows and drops quickly when unhappy.":"Entre as menores folhas do gênero, minúsculas, estreitas e verdes. Amarela e cai rápido quando não está bem.","A montane cloud-forest species that wants steady conditions. It grows very fast when happy, about 60 cm in a few months.":"Uma espécie de floresta nebular de montanha que quer condições estáveis. Cresce muito rápido quando está bem, cerca de 60 cm em poucos meses.","Filtered light; it grows well under grow lights in a humid tent.":"Luz filtrada; cresce bem sob luz de cultivo numa estufa úmida.","Never let it dry out; in the wild it gets night fog even in the dry season. Yellow leaves dropping in bunches means it is unhappy.":"Nunca deixe secar; na natureza ela recebe neblina à noite mesmo na estação seca. Folhas amarelas caindo em quantidade indicam que não está bem.","About 8 months from cutting":"Cerca de 8 meses desde a estaca","Small fuzzy butter-yellow flowers, up to 3 peduncles at once, dripping lots of nectar. Almost always in flower once mature; each flower lasts about 4 days.":"Flores pequenas e peludas, amarelo-manteiga, até 3 pedúnculos ao mesmo tempo, pingando muito néctar. Quase sempre em flor depois de adulta; cada flor dura cerca de 4 dias.","Long, oblong leaves, about 11-17 cm, with raised veins and pale side veins. Turns red in strong light.":"Folhas longas e oblongas, com cerca de 11-17 cm, nervuras em relevo e nervuras laterais claras. Fica vermelha com luz forte.","Slow and easy, grown as much for its flecked leaves as its flowers. Easy in a warm, humid tent. Rinse off the nectar to prevent sooty mold.":"Lenta e fácil, cultivada tanto pelas folhas pintadas quanto pelas flores. Fácil numa estufa quente e úmida. Lave o néctar para evitar fumagina.","Bright indirect light; sun turns the leaf flecks pink.":"Luz indireta forte; o sol deixa as pintas das folhas rosadas.","Net pots make it easier to judge when to water.":"Vasos telados facilitam saber a hora de regar.","Site page is H. erythrina 'Nara'":"A página do site é de H. erythrina 'Nara'","Very hairy flowers, 20-40 per umbel, lasting about a week, with nectar.":"Flores muito peludas, 20-40 por umbela, durando cerca de uma semana, com néctar.","Dark green elliptic leaves with visible veins and some silver flecks.":"Folhas elípticas verde-escuras com nervuras visíveis e algumas pintas prateadas.","A very slow grower that, like H. mindorensis, likes high heat and humidity. Give it support or let it hang.":"Cresce muito devagar e, como H. mindorensis, gosta de muito calor e umidade. Dê um suporte ou deixe pender.","New leaves turn red in sun.":"As folhas novas ficam vermelhas no sol.","Blooms very young":"Floresce bem jovem","Site page is H. erythrostemma aff. sp. Sumatra NS07-004 related form":"A página do site é de H. erythrostemma aff. sp. Sumatra NS07-004, uma forma aparentada","Flowers last up to 10 days.":"As flores duram até 10 dias.","Dark green leaves with darker green veins, narrow at the base and rounding out to a blunt tip. Sometimes flecked; purple veins underneath.":"Folhas verde-escuras com nervuras de verde mais escuro, estreitas na base e arredondando até uma ponta obtusa. Às vezes pintadas; nervuras roxas embaixo.","Wants high humidity and lots of warmth.":"Quer umidade alta e muito calor.","Grow lights.":"Luz de cultivo.","Under 6 months from cutting":"Menos de 6 meses desde a estaca","Once mature: dark purple to maroon flowers with a deep red corona and white hairs on the back, lasting up to 18 days. It blooms better when slightly root-bound.":"Depois de adulta: flores de roxo-escuro a bordô com corona vermelho-intensa e pelos brancos no verso, durando até 18 dias. Floresce melhor com as raízes um pouco apertadas no vaso.","Slight vanilla scent":"Leve perfume de baunilha","Also reported in eastern Indonesia and the Philippines":"Também registrada no leste da Indonésia e nas Filipinas","Thin green leaves that come in pairs like angel wings, with brown new growth.":"Folhas verdes finas que vêm em pares como asas de anjo, com brotos novos marrons.","Ideally kept at 16-24ºC and above 10ºC. A slow-growing vine to trellis or let trail; don't repot it too often. Some nurseries now sell H. lamingtoniae and H. rubida under this name.":"O ideal é mantê-la entre 16-24ºC e acima de 10ºC. Uma trepadeira de crescimento lento para treliça ou para pender; não troque de vaso com muita frequência. Alguns viveiros agora vendem H. lamingtoniae e H. rubida com este nome.","Bright, indirect light; shield it from hot direct sun.":"Luz indireta forte; proteja do sol direto quente.","Let the mix dry about 60-80%, then soak and drain.":"Deixe o substrato secar cerca de 60-80%, depois encharque e deixe escorrer.","Said to be hard to bring to flower; grown mainly for its leaves.":"Dizem que é difícil de fazer florir; cultivada principalmente pelas folhas.","A scent described as strange but nice":"Um perfume descrito como estranho, mas agradável","Long, pointed leaves with dark green veins and soft hairs, slightly wavy at the margins.":"Folhas longas e pontudas, com nervuras verde-escuras e pelos macios, levemente onduladas nas margens.","Handles warm, humid summers. Leaves yellowing and falling fast means it is unhappy. Also known as H. villosa.":"Aguenta verões quentes e úmidos. Folhas amarelando e caindo rápido indicam que não está bem. Também conhecida como H. villosa.","Bloomed after a summer outdoors.":"Floresceu depois de um verão ao ar livre.","In winter keep it cool and as dry as you dare; give it more water in summer.":"No inverno, mantenha fresca e o mais seca que tiver coragem; dê mais água no verão.","After time outdoors":"Depois de um tempo ao ar livre","Large, thick, waxy creamy-white flowers with red spots on the back, lasting about a week. It bloomed after about 1.5 years with warm days and cooler nights.":"Flores grandes, grossas e cerosas, branco-creme, com manchas vermelhas no verso, durando cerca de uma semana. Floresceu depois de cerca de 1,5 ano com dias quentes e noites mais frescas.","Very heavily perfumed: fresh and musky":"Muito perfumada: fresca e almiscarada","Long, dark green leaves with a few spots. Can grow very long in shade and turns red in brighter light.":"Folhas longas verde-escuras com algumas manchas. Podem crescer muito na sombra e ficam vermelhas com luz mais forte.","An easy, vigorous grower. Usually considered a cool grower, but it did well warm and humid.":"Fácil e vigorosa. Costuma ser considerada de clima fresco, mas foi bem no quente e úmido.","Bright light or some sun turns the leaves red.":"Luz forte ou um pouco de sol deixa as folhas vermelhas.","Keep it on the dry side; it enjoys misting.":"Mantenha mais para o seco; gosta de borrifadas.","About a year from cutting":"Cerca de um ano desde a estaca","Large waxy purplish-red flowers, 2.5-4 cm across. Don't cut the old flower stalks.":"Flores grandes e cerosas, vermelho-arroxeadas, de 2,5-4 cm. Não corte as hastes florais antigas.","Thick, rugged leaves.":"Folhas grossas e rústicas.","Likes stable conditions. A vigorous climber that likes being slightly root-bound.":"Gosta de condições estáveis. Trepadeira vigorosa que gosta das raízes um pouco apertadas no vaso.","Bright, indirect light; filtered morning sun is fine.":"Luz indireta forte; sol filtrado da manhã vai bem.","Let it dry out well between waterings; it is sensitive to overwatering.":"Deixe secar bem entre as regas; é sensível ao excesso de água.","Flowers last about 3 days. Buds that turn red are dead.":"As flores duram cerca de 3 dias. Botões que ficam vermelhos estão mortos.","Long, narrow, very soft and fuzzy dark green leaves, up to about 15-18 cm, with slight dimpling.":"Folhas longas, estreitas, muito macias e peludas, verde-escuras, de até cerca de 15-18 cm, com leves covinhas.","A powerful, heavily branching grower that needs good support. Don't let it get cold, and give it air movement along with the humidity. Not for beginners.":"Cresce com força, ramifica muito e precisa de um bom suporte. Não deixe passar frio, e dê ventilação junto com a umidade. Não é para iniciantes.","Needs strong LED light; it wouldn't set buds under fluorescent lights or in heavy shade.":"Precisa de luz LED forte; não formou botões sob luz fluorescente nem em sombra densa.","Finicky: small mistakes make young leaves drop. It needs very even watering, so a self-watering pot may be easiest.":"Exigente: pequenos erros fazem as folhas novas caírem. Precisa de regas bem regulares, então um vaso autoirrigável pode ser o mais fácil.","Several peduncles at once, with abundant nectar. Flowers last up to 5 days and vary from deep red to orange.":"Vários pedúnculos ao mesmo tempo, com néctar abundante. As flores duram até 5 dias e variam do vermelho-intenso ao laranja.","Light floral scent":"Perfume floral leve","Long, hard, waxy leaves up to about 20 cm long, with pronounced veins and sharp tips. The sunken midrib can make them look like a canoe.":"Folhas longas, duras e cerosas, de até cerca de 20 cm, com nervuras marcadas e pontas agudas. A nervura central afundada pode dar a elas a forma de uma canoa.","Nicknamed 'Tomato Soup'. Be patient: a stalled plant may restart after a change of medium.":"Apelidada de 'Sopa de Tomate'. Tenha paciência: uma planta parada pode voltar a crescer depois de trocar o substrato.","Did well in semi-hydro at first, then stalled.":"Foi bem em semi-hidroponia no começo, depois parou.","Blooms often":"Floresce com frequência","Flowers last about 5 days.":"As flores duram cerca de 5 dias.","Very fragrant":"Muito perfumada","Large, stiff dome-shaped leaves, mottled green, that press flat against the support like overlapping roof tiles. One leaf per node.":"Folhas grandes e rígidas em forma de cúpula, verde mesclado, que se apoiam planas contra o suporte como telhas sobrepostas. Uma folha por nó.","High maintenance: warm, very humid and fertilized daily. It needs a flat support for the leaves to shingle, or they roll up.":"Dá trabalho: calor, muita umidade e adubo todo dia. Precisa de um suporte plano para as folhas se sobreporem, ou elas se enrolam.","Strong LED inside a clear cloche.":"LED forte dentro de uma campânula transparente.","Mounted over a tray of water and misted daily with RO water.":"Montada sobre uma bandeja com água e borrifada todo dia com água de osmose reversa.","Hard to bloom, took years":"Difícil de florir, levou anos","Site page is H. maxima/imbricata Red Corona":"A página do site é de H. maxima/imbricata Red Corona","Among the largest flowers in the genus, 7-10 cm across. They last 14-20 days with lots of sticky nectar.":"Entre as maiores flores do gênero, com 7-10 cm. Duram 14-20 dias, com muito néctar pegajoso.","The Philippines":"Filipinas","Large, thick and leathery light green leaves, up to about 27 cm, with a strong midrib, slightly wavy edges and no flecks.":"Folhas grandes, grossas e coriáceas, verde-claras, de até cerca de 27 cm, com nervura central forte, bordas levemente onduladas e sem pintas.","It grows violently, in spurts, and the stems stiffen fast, so wrap new vines on a large support early. Enjoys warmth and humidity.":"Cresce com violência, aos surtos, e os caules endurecem rápido, então enrole as ramas novas num suporte grande logo cedo. Gosta de calor e umidade.","Started budding after moving under a strong LED in a grow tent.":"Começou a formar botões depois de ir para baixo de um LED forte numa estufa de cultivo.","Let the mix dry considerably between waterings; check the sides of the net pot to judge dryness.":"Deixe o substrato secar bastante entre as regas; olhe as laterais do vaso telado para avaliar a secura.","Early buds dropped":"Os primeiros botões caíram","Site page is H. imperialis Palawan AH-283":"A página do site é de H. imperialis Palawan AH-283","Fuzzy yellow flowers, up to 30 per umbel.":"Flores amarelas e peludas, até 30 por umbela.","Thin, lance-shaped green leaves, quite variable in shape and edge, that can sun-stress to orange-red.":"Folhas verdes finas e lanceoladas, bem variáveis na forma e na borda, que podem ficar vermelho-alaranjadas com o estresse de sol.","An easy grower that dislikes warm conditions.":"Fácil de cultivar, mas não gosta de calor.","Won't bloom under grow lights; it bloomed after time outdoors.":"Não floresce sob luz de cultivo; floresceu depois de um tempo ao ar livre.","Seems to need cool weather to set buds":"Parece precisar de tempo fresco para formar botões","White flowers, profuse under grow lights. They last 5-6 days and the nectar doesn't drip.":"Flores brancas, abundantes sob luz de cultivo. Duram 5-6 dias e o néctar não pinga.","Small, rounded obovate leaves about 2 cm long, thick, hard and leathery, dark green with wavy edges.":"Folhas pequenas, arredondadas e obovadas, com cerca de 2 cm, grossas, duras e coriáceas, verde-escuras com bordas onduladas.","Small and non-twining, and slow unless warm and humid. Hang it or use a trellis.":"Pequena e não volúvel, e lenta a não ser no quente e úmido. Deixe pendente ou use uma treliça.","Perfect under grow lights.":"Perfeita sob luz de cultivo.","Water thoroughly and let it dry out; it dislikes constant dampness.":"Regue bem e deixe secar; não gosta de umidade constante.","Flowers last 4-5 days, with no nectar.":"As flores duram 4-5 dias, sem néctar.","No specific scent described":"Nenhum perfume específico descrito","Thin green leaves that open in pairs like angel wings, with brown new growth.":"Folhas verdes finas que se abrem em pares como asas de anjo, com brotos novos marrons.","Slow and best on a support. Now counted as a form of H. globulifera.":"Lenta e melhor num suporte. Agora considerada uma forma de H. globulifera.","Bright, but not direct sun.":"Luz forte, mas sem sol direto.","Tolerates some dryness, but the leaves get fuzzy if it dries too much.":"Tolera um pouco de seca, mas as folhas ficam felpudas se secar demais.","At about 18 months old":"Com cerca de 18 meses","Huge bell-shaped flowers, the largest in the genus, with a yellow center fading to pink or burgundy, 3-7 per cluster. It needs high light and at least about 1.8 m of vine before it blooms.":"Flores enormes em forma de sino, as maiores do gênero, com centro amarelo que passa para rosa ou bordô, 3-7 por cacho. Precisa de muita luz e de pelo menos cerca de 1,8 m de rama antes de florir.","Large leaves covered in soft, velvety fuzz.":"Folhas grandes cobertas de uma penugem macia e aveludada.","A robust twining climber that needs support.":"Trepadeira volúvel robusta que precisa de suporte.","Bright, indirect light, and higher light to bloom.":"Luz indireta forte, e mais luz para florir.","Let it dry between waterings, watering when the surface is dry to the touch.":"Deixe secar entre as regas, regando quando a superfície estiver seca ao toque.","Flowers last about 5 days. It can bloom young, in fall and winter, triggered by shorter days.":"As flores duram cerca de 5 dias. Pode florir jovem, no outono e no inverno, estimulada pelos dias mais curtos.","Soft, narrow, nearly cylindrical leaves up to about 5 cm, covered in fine hairs and grooved underneath.":"Folhas macias, estreitas, quase cilíndricas, de até cerca de 5 cm, cobertas de pelos finos e com um sulco embaixo.","One of the hardest Hoyas to keep alive. It has very fine roots, so pot several cuttings together for a fuller hanging plant, and mist it often.":"Uma das Hoyas mais difíceis de manter viva. Tem raízes muito finas, então plante várias estacas juntas para uma planta pendente mais cheia, e borrife com frequência.","Grow lights help buds open when windows get dim in fall.":"A luz de cultivo ajuda os botões a abrir quando as janelas ficam escuras no outono.","Likes it fairly dry, with less water than other Hoyas; weekly watering worked.":"Gosta de ficar bem seca, com menos água que outras Hoyas; regar uma vez por semana funcionou.","Flowers last about 10 days, 10-20 per umbel.":"As flores duram cerca de 10 dias, 10-20 por umbela.","Leaves with distinctive coloring, on a shrubby, non-twining plant.":"Folhas de coloração marcante, numa planta arbustiva, não volúvel.","Very tough. Non-twining, so tie it to a trellis; it can grow over 1.2 m tall. Its small roots mean it needs repotting less often. Mist it in hot weather.":"Muito resistente. Não é volúvel, então amarre numa treliça; pode passar de 1,2 m de altura. As raízes pequenas fazem com que precise trocar de vaso com menos frequência. Borrife no calor.","Shade-loving.":"Gosta de sombra.","Don't let it dry out completely.":"Não deixe secar por completo.","Very reliable":"Muito confiável","Flowers last up to 3 weeks. Some strains bloom easily, others resist.":"As flores duram até 3 semanas. Algumas linhagens florescem fácil, outras resistem.","Citrus":"Cítrico","Gardenia-like scent with a hint of citrus":"Perfume parecido com gardênia, com um toque cítrico","Thick, oval, pointed leaves, light to deep green and glossy. New leaves come in copper before hardening off.":"Folhas grossas, ovais e pontudas, de verde-claro a verde-escuro e brilhantes. As folhas novas nascem cor de cobre antes de endurecer.","Becomes a huge vine. Support it with large hoops and repot yearly; new vines break easily.":"Vira uma trepadeira enorme. Apoie em arcos grandes e troque de vaso todo ano; as ramas novas quebram fácil.","Needs lots of light to flower. Up north, grow lights set to exactly 12 hours a day are key.":"Precisa de muita luz para florir. Em lugares de pouca luz, luz de cultivo ajustada para exatamente 12 horas por dia é essencial.","About every 2 days in summer. Keep it on the dry side in winter, then water well once buds appear and don't let it dry.":"Mais ou menos a cada 2 dias no verão. No inverno, mantenha mais para o seco; quando aparecerem botões, regue bem e não deixe secar.","At different times of year":"Em épocas diferentes do ano","Very free-flowering, 15-25 per umbel, each flower lasting up to a week.":"Floresce com muita facilidade, 15-25 por umbela, cada flor durando até uma semana.","Caramel":"Caramelo","Narrow elliptical leaves about 5 cm long, thick and semi-succulent with silver speckles. New growth is red.":"Folhas elípticas estreitas, com cerca de 5 cm, grossas e semissuculentas, com pontinhos prateados. Os brotos novos são vermelhos.","A strong, very easy hanging plant that does fine in average humidity. Sold for years as H. gracilis.":"Uma planta pendente forte e muito fácil, que vai bem com umidade comum. Vendida por anos como H. gracilis.","Blooms almost nonstop under grow lights.":"Floresce quase sem parar sob luz de cultivo.","Small hairy flowers, challenging to bloom. The standard form is red; pink and yellow forms exist.":"Flores pequenas e peludas, desafiadoras de florir. A forma padrão é vermelha; existem formas rosa e amarela.","Fairly large leaves with a prominent midvein, glossy green and reddening in direct sun.":"Folhas razoavelmente grandes com nervura central saliente, verde-brilhantes e avermelhando no sol direto.","Warm and humid, with a night drop of about 5-6 degrees.":"Quente e úmido, com uma queda de uns 5-6 graus à noite.","Bright, but little direct sun.":"Luz forte, mas pouco sol direto.","Keep it evenly moist, but it is very prone to overwatering, so err on the dry side.":"Mantenha uniformemente úmida, mas ela sofre muito com excesso de água, então na dúvida deixe mais seca.","Glossy green leaves up to about 12 cm with a prominent midvein, often tinged red in direct sun.":"Folhas verde-brilhantes de até cerca de 12 cm, com nervura central saliente, muitas vezes avermelhadas no sol direto.","Profuse, up to 40 per umbel, dripping lots of nectar. Each flower lasts up to 12 days, and it usually drops the peduncle after.":"Abundante, até 40 por umbela, pingando muito néctar. Cada flor dura até 12 dias, e depois ela costuma soltar o pedúnculo.","Light lemon scent":"Leve perfume de limão","Thin, dark green leaves about 8-14 cm long with visible veins and some flecks.":"Folhas finas verde-escuras, com cerca de 8-14 cm, nervuras visíveis e algumas pintas.","Vigorous; it becomes a shrub unless restarted now and then. Pinch the top so it branches.":"Vigorosa; vira um arbusto a não ser que seja recomeçada de vez em quando. Belisque a ponta para ramificar.","Filtered light.":"Luz filtrada.","Needs plenty, but don't keep it wet, especially when cold.":"Precisa de bastante, mas não deixe molhada, principalmente no frio.","Site page is H. multiflora in general":"A página do site é de H. multiflora em geral","White flowers that come easily, triggered by the shorter days of fall, each lasting about 5 days.":"Flores brancas que vêm fácil, estimuladas pelos dias mais curtos do outono, cada uma durando cerca de 5 dias.","Sweet citrus scent":"Perfume cítrico doce","Smaller leaves on a compact, non-twining shrub.":"Folhas menores num arbusto compacto, não volúvel.","A very tough, easy, small non-twining shrub. Also known as H. cembra.":"Um arbusto pequeno, não volúvel, muito resistente e fácil. Também conhecida como H. cembra.","Keep it moist in warm months and drier when it cools.":"Mantenha úmida nos meses quentes e mais seca quando esfriar.","Small waxy reddish flowers that last up to 10 days. It needs to mature first.":"Flores pequenas e cerosas, avermelhadas, que duram até 10 dias. Precisa amadurecer antes.","Butterscotch":"Caramelo amanteigado","Sweet caramel or butterscotch scent":"Perfume doce de caramelo ou caramelo amanteigado","Light green, round-elliptic leaves that cup like spoons, thick and fleshy.":"Folhas verde-claras, redondo-elípticas, côncavas como colheres, grossas e carnudas.","Warm, with nights cooler than days. A hanging vine, slower and more compact than H. brevialata.":"Quente, com noites mais frescas que os dias. Uma trepadeira pendente, mais lenta e mais compacta que H. brevialata.","Filtered or dappled light; direct sun can scorch it.":"Luz filtrada ou salpicada; o sol direto pode queimá-la.","Let the top few cm dry between waterings.":"Deixe os primeiros centímetros secarem entre as regas.","Forms peduncles readily with no bud drop. Flowers last a few days longer than H. darwinii's.":"Forma pedúnculos com facilidade, sem queda de botões. As flores duram alguns dias a mais que as de H. darwinii.","Hybrid of H":"Híbrido de H","By Antone Jones. Darwinii x H. elliptica":"Por Antone Jones. Darwinii x H. elliptica","Firm, glossy elliptic leaves about 6-10 cm long, medium green with paler veins, reddening in bright light. Tolerates sprays well.":"Folhas firmes, brilhantes e elípticas, com cerca de 6-10 cm, verde médio com nervuras mais claras, avermelhando com luz forte. Tolera bem pulverizações.","Warm and humid. The leaves tolerate fertilizer and neem sprays.":"Quente e úmido. As folhas toleram pulverizações de adubo e de neem.","Water once the mix is nearly dry.":"Regue quando o substrato estiver quase seco.","Flowers come mostly single and last about 2 weeks. Cool nights around 10ºC and warm days around 29ºC triggered blooming.":"As flores vêm quase sempre sozinhas e duram cerca de 2 semanas. Noites frescas por volta de 10ºC e dias quentes por volta de 29ºC estimularam a floração.","Narrow, almost grass-like dark green leaves, paler in bright light.":"Folhas estreitas, quase como capim, verde-escuras, mais claras com luz forte.","Give it a day/night temperature swing.":"Dê a ela uma variação de temperatura entre dia e noite.","Bloomed under grow lights. Bright sun makes the leaves paler.":"Floresceu sob luz de cultivo. Sol forte deixa as folhas mais claras.","Took about 4.5 years":"Levou cerca de 4,5 anos","Rounded clusters of small cream to white flowers.":"Cachos arredondados de pequenas flores de creme a brancas.","Fragrant. Described as gardenia-like":"Perfumada. Descrita como parecida com gardênia","Warm and humid.":"Quente e úmido.","Semi-shade to bright indirect light; avoid direct sun, though more sun gives more flowers.":"Meia-sombra a luz indireta forte; evite sol direto, embora mais sol dê mais flores.","Moderate: water well, then let it dry out between waterings. Keep it damp in warm months.":"Moderada: regue bem e deixe secar entre as regas. Mantenha úmida nos meses quentes.","NParks Singapore / Plant Proper / Kew":"NParks Singapura / Plant Proper / Kew","Long, thin and narrow light green leaves with no flecks, on stems that can grow flattened.":"Folhas longas, finas e estreitas, verde-claras, sem pintas, em caules que podem crescer achatados.","Flat new stems that round out with age. Very hard to propagate.":"Caules novos achatados que arredondam com a idade. Muito difícil de propagar.","Partial shade.":"Meia-sombra.","Keep it moist.":"Mantenha úmida.","Cooler nights trigger buds, then it can go back to warm. Flowers come mostly at the branch tips, last about a week and are very nectar-rich.":"Noites mais frescas estimulam os botões, depois ela pode voltar ao calor. As flores vêm principalmente nas pontas dos ramos, duram cerca de uma semana e são muito ricas em néctar.","Rhomboid, fishtail-shaped leaves about 8-12 cm long with many straight parallel side veins. New leaves are much paler.":"Folhas romboides em forma de rabo de peixe, com cerca de 8-12 cm e muitas nervuras laterais retas e paralelas. As folhas novas são bem mais claras.","Roots easily but can decline fast, with yellow leaves that drop. A heavy feeder: the leaves go pale if underfed. Several cuttings per pot help it bloom, and a healthy one makes a nice basket.":"Enraíza fácil, mas pode definhar rápido, com folhas amarelas que caem. Come muito: as folhas ficam pálidas se faltar adubo. Várias estacas por vaso ajudam a florir, e uma planta saudável fica linda num cesto suspenso.","Delicate pink flowers with a pearly sheen, lasting about a week, with little nectar.":"Flores cor-de-rosa delicadas com brilho perolado, durando cerca de uma semana, com pouco néctar.","Long, glossy lance-shaped leaves, deep green with silvery splashes. New leaves can come in pink.":"Folhas longas, brilhantes e lanceoladas, verde-escuras com respingos prateados. As folhas novas podem nascer rosadas.","Cool-tolerant and one of the easier Hoyas; it does well anywhere.":"Tolera o frio e é uma das Hoyas mais fáceis; vai bem em qualquer lugar.","Blooms in natural or grow light. Flower color depends on how much sun it gets.":"Floresce com luz natural ou de cultivo. A cor das flores depende de quanto sol ela recebe.","Flowers last up to 2 weeks, with little nectar.":"As flores duram até 2 semanas, com pouco néctar.","Long, glossy lance-shaped leaves, deep green with silver flecks, usually a little broader than other pubicalyx forms.":"Folhas longas, brilhantes e lanceoladas, verde-escuras com pintas prateadas, geralmente um pouco mais largas que as de outras formas de pubicalyx.","Site page is H. pubicalyx in general":"A página do site é de H. pubicalyx em geral","Flowers last 10-14 days. It needs a day/night temperature drop and rebloomed when nights reached 10-15ºC.":"As flores duram 10-14 dias. Precisa de queda de temperatura entre dia e noite e voltou a florir quando as noites chegaram a 10-15ºC.","Lemon-like scent":"Perfume parecido com limão","Flat, very narrow grass-like leaves about 4-6 cm long with a notched tip, growing in clusters.":"Folhas planas, muito estreitas, como capim, com cerca de 4-6 cm e ponta chanfrada, crescendo em tufos.","Keep conditions steady: moving it made buds drop.":"Mantenha as condições estáveis: mudá-la de lugar fez os botões caírem.","Bright but cool. Bloomed under grow lights.":"Clara, mas fresca. Floresceu sob luz de cultivo.","Keep it evenly damp but not soaked.":"Mantenha uniformemente úmida, mas não encharcada.","Cute flowers that last about a week.":"Flores fofas que duram cerca de uma semana.","Slightly sweet scent":"Perfume levemente doce","Thick, dark green, almost square leaves, oblong and slightly pinched in the middle, with a fuzzy, hairy surface.":"Folhas grossas, verde-escuras, quase quadradas, oblongas e levemente estreitadas no meio, com superfície felpuda e peluda.","Easy and fast growing. First sold as H. sp. Square and sp. Rectangular Leaf.":"Fácil e de crescimento rápido. Vendida primeiro como H. sp. Square e sp. Rectangular Leaf.","Once mature: purple to peach-mauve flowers, sometimes yellow and purple on the same plant. One shop lists white flowers instead.":"Depois de adulta: flores de roxo a malva-pêssego, às vezes amarelas e roxas na mesma planta. Uma loja lista flores brancas.","Shiny green oval leaves, wider than lamingtoniae, with orange new growth.":"Folhas ovais verde-brilhantes, mais largas que as da lamingtoniae, com brotos novos alaranjados.","A graceful trailing or twining vine. Now counted as a form of H. globulifera.":"Uma trepadeira graciosa, pendente ou volúvel. Agora considerada uma forma de H. globulifera.","Apricot-colored flowers, few per umbel, lasting 4-5 days.":"Flores cor de damasco, poucas por umbela, durando 4-5 dias.","Very shiny light green leaves, about 6-12 cm long, with paler veins and slightly curved edges.":"Folhas verde-claras muito brilhantes, com cerca de 6-12 cm, nervuras mais claras e bordas levemente curvas.","Warm and very humid.":"Quente e muito úmido.","Does well under grow lights; the foliage looks best out of very strong sun.":"Vai bem sob luz de cultivo; a folhagem fica mais bonita longe do sol muito forte.","Fussy about watering: water sparingly.":"Exigente com a rega: regue com moderação.","Cream to pink flowers and a heavy nectar producer.":"Flores de creme a rosa e muita produção de néctar.","Borneo (H. latifolia group)":"Bornéu (grupo H. latifolia)","Very large oval leaves with prominent veins and splashes.":"Folhas ovais muito grandes com nervuras salientes e respingos.","Prefers it warm and humid. Give it climbing support; easy care.":"Prefere quente e úmido. Dê suporte para escalar; cuidado fácil.","Let the mix dry slightly between waterings.":"Deixe o substrato secar um pouco entre as regas.","Hard to bloom: warm, humid conditions give growth but no flowers. Flowers last about a week.":"Difícil de florir: condições quentes e úmidas dão crescimento, mas não flores. As flores duram cerca de uma semana.","Spicy floral scent from the afternoon":"Perfume floral picante a partir da tarde","Tiny round leaves about 1.5-2 cm, dark green and fuzzy, with scattered gray spots.":"Folhas redondas minúsculas, com cerca de 1,5-2 cm, verde-escuras e felpudas, com manchinhas cinza espalhadas.","A tough plant, but cooler, drier conditions cause yellowing and leaf drop.":"Uma planta resistente, mas condições mais frescas e secas causam amarelamento e queda de folhas.","Small creamy-white clusters with pink centers. It flowers readily, each flower lasting about a week, with large nectar drops.":"Cachos pequenos branco-creme com centros rosados. Floresce com facilidade, cada flor durando cerca de uma semana, com gotas grandes de néctar.","Long, narrow, thick leaves about 1 cm wide and up to 18 cm long, boat-shaped like string beans, dark green above and paler below.":"Folhas longas, estreitas e grossas, com cerca de 1 cm de largura e até 18 cm de comprimento, em forma de barquinho como vagens, verde-escuras em cima e mais claras embaixo.","Happy at normal indoor temperature and humidity. Trailing, and great in hanging baskets.":"Fica bem com a temperatura e a umidade normais de dentro de casa. Pendente, ótima em cestos suspensos.","Bright indirect at minimum, and a few hours of direct sun helps. More light, more flowers.":"No mínimo luz indireta forte, e algumas horas de sol direto ajudam. Mais luz, mais flores.","Water thoroughly, then let it dry out completely or nearly.":"Regue bem e deixe secar por completo ou quase.","Often, several times a year":"Com frequência, várias vezes por ano","Hard-won blooms, 20-30 per umbel, each flower lasting about a week.":"Florações suadas, 20-30 por umbela, cada flor durando cerca de uma semana.","Faint caramel scent":"Perfume fraco de caramelo","Narrow, stiff semi-succulent leaves, olive green densely flecked with silver, burgundy underneath. Turns red in bright sun.":"Folhas estreitas, rígidas e semissuculentas, verde-oliva cheias de pintas prateadas, bordô embaixo. Fica vermelha no sol forte.","Likes average temperatures and humidity. Best hanging.":"Gosta de temperatura e umidade medianas. Fica melhor pendente.","Strong to moderate light. Bright sun turns the leaves red.":"Luz forte a moderada. Sol forte deixa as folhas vermelhas.","Doesn't like to dry out, but doesn't want wet soil either.":"Não gosta de secar, mas também não quer substrato molhado.","Can flower even as a rooting cutting, in a color unlike the usual buff tones.":"Pode florir ainda como estaca enraizando, numa cor diferente dos tons bege habituais.","Long, narrow, slightly succulent dark green leaves with pale veins and fine points. Blushes rosy in more light.":"Folhas longas, estreitas, levemente suculentas, verde-escuras, com nervuras claras e pontas finas. Fica rosada com mais luz.","Vigorous in semi-hydro.":"Vigorosa em semi-hidroponia.","Semi-hydro worked very well.":"A semi-hidroponia funcionou muito bem.","Flowers last about 4 days.":"As flores duram cerca de 4 dias.","Long, lance-shaped, fleshy leaves.":"Folhas longas, lanceoladas e carnudas.","Compact and easy, and tolerates down to about 7ºC. Formerly sold as H. longifolia pubescent.":"Compacta e fácil, tolera até cerca de 7ºC. Antes era vendida como H. longifolia pubescent.","Dappled sun outdoors in summer.":"Sol salpicado ao ar livre no verão.","After cool outdoor time":"Depois de um tempo fresco ao ar livre","Small buttery-yellow flowers with burgundy tips and a white corona, lasting up to 8 days. A frequent bloomer with lots of light and humidity.":"Flores pequenas amarelo-manteiga com pontas bordô e corona branca, durando até 8 dias. Floresce com frequência com bastante luz e umidade.","Coconut":"Coco","Sweet coconut scent":"Perfume doce de coco","Large, thick, glossy ovate leaves that turn deep red when sun-stressed.":"Folhas grandes, grossas, brilhantes e ovais, que ficam vermelho-intensas com o estresse de sol.","Fast vining and low maintenance.":"Trepadeira rápida e de pouca manutenção.","Bright, indirect light. The leaves turn red when sun-stressed.":"Luz indireta forte. As folhas ficam vermelhas com o estresse de sol.","Let the soil dry almost completely, and never leave it in standing water.":"Deixe o substrato secar quase por completo, e nunca deixe com água parada.","Slow to bloom, with flowers lasting about 6 days. Buds dropped when it was moved indoors.":"Demora a florir, com flores que duram cerca de 6 dias. Os botões caíram quando ela foi levada para dentro de casa.","Highly perfumed":"Muito perfumada","Small, stiff oval leaves about 4.5 cm long, gray-green and covered in soft hairs, with scattered silver spots.":"Folhas pequenas, rígidas e ovais, com cerca de 4,5 cm, verde-acinzentadas e cobertas de pelos macios, com manchinhas prateadas espalhadas.","Slow-growing. Likes it cool and moist, with steady moisture.":"Crescimento lento. Gosta de fresco e úmido, com umidade constante.","Blooms as days get shorter; grow lights disrupted this.":"Floresce quando os dias encurtam; a luz de cultivo atrapalhou isso.","Let it dry completely between waterings and don't overwater.":"Deixe secar por completo entre as regas e não regue demais.","Yellowish to white flowers with a red or pink center, lasting about 5 days. It can bloom early, sometimes even as a cutting.":"Flores de amareladas a brancas, com centro vermelho ou rosa, durando cerca de 5 dias. Pode florir cedo, às vezes ainda como estaca.","Thick, hard ovate leaves about 6-11 cm long, light green with paler veins and some silver flecks. Very variable between clones.":"Folhas grossas, duras e ovais, com cerca de 6-11 cm, verde-claras com nervuras mais claras e algumas pintas prateadas. Muito variáveis entre clones.","Formerly sold as H. acuta.":"Antes era vendida como H. acuta.","Weak bloomer, about 2 years to first flowers":"Floresce pouco, cerca de 2 anos até as primeiras flores","Site page is H. verticillata var. citrina":"A página do site é de H. verticillata var. citrina","25-50 per umbel, lasting 4-5 days, with no nectar.":"25-50 por umbela, durando 4-5 dias, sem néctar.","Stiff, thick green leaves marked by five prominent veins. New leaves come in dark red, and all leaves redden in bright light.":"Folhas verdes rígidas e grossas, marcadas por cinco nervuras salientes. As folhas novas nascem vermelho-escuras, e todas avermelham com luz forte.","An easy grower with more flower stalks than leaves.":"Fácil de cultivar, com mais hastes florais que folhas.","Bright light reddens new leaves, but lots of sun can burn them.":"Luz forte avermelha as folhas novas, mas muito sol pode queimá-las.","Easy, prolific bloomer, from a 1-year-old cutting":"Floresce fácil e em abundância, a partir de uma estaca de 1 ano","Flowers last about 5 days, with nectar.":"As flores duram cerca de 5 dias, com néctar.","Like warm honey":"Como mel morno","No origin data":"Sem dados de origem","Small, almond-shaped olive green leaves, softly fuzzy, with darker edges that blush red to bronze in bright light.":"Folhas pequenas em forma de amêndoa, verde-oliva, com uma penugem suave e bordas mais escuras que ficam de vermelho a bronze com luz forte.","Robust and not fussy about winter humidity, though cuttings are slow to establish.":"Robusta e pouco exigente com a umidade no inverno, embora as estacas demorem a pegar.","The leaves turn purpler in more sun.":"As folhas ficam mais arroxeadas com mais sol.","Keep a regular schedule: avoid long dry spells, but never let it get waterlogged.":"Mantenha uma rotina regular: evite longos períodos secos, mas nunca deixe encharcar.","About 18 months from cutting":"Cerca de 18 meses desde a estaca","Site page is H. sp. aff. burtoniae related form":"A página do site é de H. sp. aff. burtoniae, uma forma aparentada","Pink flowers with yellow centers. It blooms often, even as a cutting, and flowers last about 5 days.":"Flores cor-de-rosa com centros amarelos. Floresce com frequência, até como estaca, e as flores duram cerca de 5 dias.","Caramel-like":"Parecido com caramelo","Small, thick, pointed elliptical leaves about 4-6 cm long, dark green with darker edges and a paler underside.":"Folhas pequenas, grossas, elípticas e pontudas, com cerca de 4-6 cm, verde-escuras com bordas mais escuras e o verso mais claro.","Tricky to root, so pot several cuttings together.":"Difícil de enraizar, então plante várias estacas juntas.","Semi-hydro with a water reservoir kept it alive. Don't overwater.":"A semi-hidroponia com reservatório de água a manteve viva. Não regue demais.","10-20 per umbel at the vine tips, lasting about a week and dripping heavy nectar. The peduncles fall off after.":"10-20 por umbela nas pontas das ramas, durando cerca de uma semana e pingando muito néctar. Depois os pedúnculos caem.","Also described as citrus and coconut":"Também descrito como cítrico e coco","Small ovate leaves about 3-6 cm long with a pointed tip and visible midvein. New leaves are lime green and a little hairy, darkening with age.":"Folhas pequenas e ovais, com cerca de 3-6 cm, ponta aguda e nervura central visível. As folhas novas são verde-limão e um pouco peludas, escurecendo com a idade.","Undemanding. Upright and shrubby, so it needs support.":"Pouco exigente. Ereta e arbustiva, então precisa de suporte.","Site page is H. cumingiana Large Leaf AKA H. densifolia":"A página do site é de H. cumingiana Large Leaf, também chamada H. densifolia","Pink flowers, but it blooms rarely. They last up to a week, and the nectar turns orange-brown with age.":"Flores cor-de-rosa, mas floresce raramente. Duram até uma semana, e o néctar fica marrom-alaranjado com o tempo.","Thick, medium-sized leaves, often irregular in shape.":"Folhas grossas, de tamanho médio, muitas vezes de forma irregular.","Easy and grows anywhere. A robust, fast vine for a large support that loves heat and humidity.":"Fácil e cresce em qualquer lugar. Uma trepadeira robusta e rápida para um suporte grande, que adora calor e umidade.","Flowers last only 1-2 days, and their color varies with conditions from yellow and orange to pearly pink. They attract butterflies.":"As flores duram só 1-2 dias, e a cor varia com as condições, do amarelo e laranja ao rosa perolado. Atraem borboletas.","Small to medium green leaves with a striking network of white veins, coloring up in strong light.":"Folhas verdes pequenas a médias com uma rede marcante de nervuras brancas, que ganham cor com luz forte.","Not difficult and highly recommended, though slow. It grows well in a humid tent.":"Não é difícil e é muito recomendada, embora lenta. Cresce bem numa estufa úmida.","Grow lights (LED and T-5). Bright indirect light reddens the leaves.":"Luz de cultivo (LED e T-5). Luz indireta forte avermelha as folhas.","Likes a good drink every 7-10 days.":"Gosta de uma boa rega a cada 7-10 dias.","About 16 months from cutting":"Cerca de 16 meses desde a estaca","Among the largest flowers in the genus. They last 14-20 days with lots of sticky nectar.":"Entre as maiores flores do gênero. Duram 14-20 dias, com muito néctar pegajoso.","Large, thick and leathery leaves, up to about 27 cm, with a strong midrib and slightly wavy edges.":"Folhas grandes, grossas e coriáceas, de até cerca de 27 cm, com nervura central forte e bordas levemente onduladas.","Grew over 1 m of new vine in one summer and enjoys warmth and humidity. If the roots rot, save it with a cutting in a small net pot.":"Cresceu mais de 1 m de rama nova num só verão e gosta de calor e umidade. Se as raízes apodrecerem, salve com uma estaca num pequeno vaso telado.","Flowers with nectar.":"Flores com néctar.","Large, stiff, glossy dark green succulent leaves, about 9-13 cm, with no visible veins.":"Folhas suculentas grandes, rígidas e brilhantes, verde-escuras, com cerca de 9-13 cm, sem nervuras visíveis.","Wants high heat and humidity.":"Quer muito calor e umidade.","Bloomed only under grow lights in a tent.":"Só floresceu sob luz de cultivo numa estufa.","Very hard to bloom, took 4 years":"Muito difícil de florir, levou 4 anos","Site page is H. meliflua ssp. fraterna":"A página do site é de H. meliflua ssp. fraterna","Tight balls of up to 25 tiny pale yellow to orange flowers, lasting about 4 days.":"Bolas compactas de até 25 flores minúsculas, de amarelo-claro a laranja, durando cerca de 4 dias.","Small oval leaves, olive colored, with a rough texture.":"Folhas pequenas e ovais, cor de oliva, de textura áspera.","A wiry twining vine that doesn't tolerate temperatures below 14ºC.":"Uma trepadeira volúvel de ramas finas que não tolera temperaturas abaixo de 14ºC.","A bright location.":"Um lugar claro.","Water thoroughly and let the soil dry between waterings.":"Regue bem e deixe o substrato secar entre as regas.","Color varies; this is the purple clone.":"A cor varia; este é o clone roxo.","Among the worst-smelling Hoya flowers":"Entre as flores de Hoya de pior cheiro","In ant-occupied tree hollows":"Em ocos de árvores ocupados por formigas","Small, thick oval leaves about 6 cm long, emerald green, turning reddish in high light.":"Folhas pequenas, grossas e ovais, com cerca de 6 cm, verde-esmeralda, ficando avermelhadas com muita luz.","Needs more warmth.":"Precisa de mais calor.","Prone to root rot, so water much less, though it doesn't like to dry out fully.":"Propensa a podridão das raízes, então regue bem menos, embora não goste de secar por completo.","An unusual flower shape, 10-20 per umbel, lasting up to 2 weeks, with no nectar. The author's clone rarely drops buds.":"Uma forma de flor incomum, 10-20 por umbela, durando até 2 seman /* English to Portuguese for one piece of text (trimmed), or null when there's no translation */
function trPT(s, ctx){
  if(ctx && TR_CTX[ctx] && TR_CTX[ctx][s]) return TR_CTX[ctx][s];
  if(I18N_PT[s]) return I18N_PT[s];
  for(const [re, f] of TR_PATTERNS){ const m = s.match(re); if(m) return f(m); }
  /* text put together from known sentences */
  const parts = s.split(/(?<=\.)\s+/);
  if(parts.length > 1){ const out = parts.map(x => I18N_PT[x] || I18N_PT[x.replace(/\.$/, "")] && I18N_PT[x.replace(/\.$/, "")] + "."); if(out.every(Boolean)) return out.join(" "); }
  return null;
}
/* every piece of text in either language, for search */
const trAll = s => { s = String(s || ""); if(!s) return ""; const t = s.split(/\n+/).map(x => trPT(x.trim()) || "").join(" "); return s + " " + t; };
const TR_ATTRS = ["aria-label", "title", "placeholder", "alt"];
const TR_TEXT = new WeakMap(), TR_ATTR = new WeakMap();   /* node -> {en, shown}: the English original and what was put in its place */
function trText(n){
  const p = n.parentElement; if(!p || p.closest("script,style,[data-no-tr]")) return;
  const v = n.nodeValue, rec = TR_TEXT.get(n);
  if(rec && v === rec.shown){ if(LANG === "en"){ n.nodeValue = rec.en; TR_TEXT.delete(n); } return; }
  if(LANG === "en") return;
  const s = v.trim(); if(!/[A-Za-z]{2}/.test(s)) return;
  const pt = trPT(s, p.closest("[data-tr]") && p.closest("[data-tr]").dataset.tr); if(!pt) return;
  const shown = v.replace(s, pt); TR_TEXT.set(n, {en: v, shown}); n.nodeValue = shown;
}
function trAttrs(el){
  if(el.closest && el.closest("[data-no-tr]")) return;
  let rec = TR_ATTR.get(el);
  for(const a of TR_ATTRS){
    if(!el.hasAttribute || !el.hasAttribute(a)) continue;
    const v = el.getAttribute(a), r = rec && rec[a];
    if(r && v === r.shown){ if(LANG === "en"){ el.setAttribute(a, r.en); delete rec[a]; } continue; }
    if(LANG === "en") continue;
    const pt = /[A-Za-z]{2}/.test(v) && trPT(v.trim()); if(!pt) continue;
    if(!rec){ rec = {}; TR_ATTR.set(el, rec); } rec[a] = {en: v, shown: pt}; el.setAttribute(a, pt);
  }
}

/* the builder's tab indicator; other code still asks to move it (resize, language), so it stays, empty */
function moveSegThumb(){}
/* routing */
const view = document.getElementById("view");
let first = true;
/* origin card: open measures the back's full list and grows the card to fit it; Escape or a click elsewhere closes it */
/* opening the scent card sets its larger ribbon gently waving: the waves drift along and settle on an in-out ease that is
   already a quarter in when the card starts to flip (so it is moving at full pace as the card opens), while the bands
   soften, their blur growing as the card opens */
function waveScent(box, open = true){
  /* the open scent card's big ribbon has no animation: opening draws it straight in its final form (shifted waves, softer
     and larger than the closed card's), and closing leaves it as it is while the card turns away */
  if(!box || !open) return; const svg = box.querySelector("svg"), p = DATA.find(x => x.name === box.dataset.sr), sc = p && scent(p); if(!svg || !sc || box._st) return;
  const shift = 2.8, blur = 2.6, scale = 2.5; box._st = [shift, blur, scale];
  svg.innerHTML = scentRibbon(p, sc, false, {id: "srb", shift, blur, inner: true});
  svg.style.transform = `translateY(${(-22*(scale - 1)/1.5).toFixed(2)}%) scale(${scale.toFixed(3)})`;   /* risen a little, as it is larger */
}
/* a CSS cubic-bezier timing curve as a function, so script-driven motion can use the same easing as the CSS around it */
function bezier(x1, y1, x2, y2){
  const f = (a, b, t) => 3*a*(1 - t)*(1 - t)*t + 3*b*(1 - t)*t*t + t*t*t;
  return x => { if(x <= 0 || x >= 1) return x; let lo = 0, hi = 1, t = x; for(let i = 0; i < 24; i++){ t = (lo + hi)/2; if(f(x1, x2, t) < x) lo = t; else hi = t; } return f(y1, y2, t); };
}
/* opening the origin card turns the whole globe a little, west to east, and lets it come to rest with the places facing forward */
function spinGlobe(svg){
  if(!svg || !svg.dataset.g || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const {geo, lat0, lon0, id} = JSON.parse(svg.dataset.g), from = lon0 - 38, T = 2000, t0 = performance.now() - 500;   /* already a quarter of the way in as the card starts to flip, so it is at full speed (mid ease) when the card has opened */
  const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;   /* eases in and out: it gathers speed gently and settles just as gently, no jolt at either end */
  cancelAnimationFrame(svg._spin);
  const frame = now => { const k = Math.max(0, Math.min(1, (now - t0)/T));
    svg.innerHTML = globeView(geo, true, id, lat0 + 4*(1 - ease(k)), from + (lon0 - from)*ease(k));
    if(k < 1) svg._spin = requestAnimationFrame(frame); };

}
function originToggle(tile, open){
  const oc = tile.querySelector(".oc"), back = tile.querySelector(".oc-back"); if(!oc || !back) return;
  const h0 = tile.getBoundingClientRect().height;

  oc.style.setProperty("--oc-h", oc.getBoundingClientRect().height + "px");
  void oc.offsetHeight;
  if(open){ back.style.height = "auto"; back.style.bottom = "auto"; const need = back.scrollHeight; back.style.height = ""; back.style.bottom = "";
    oc.style.setProperty("--oc-h", Math.max(h0, need) + "px"); }
  else { oc.style.setProperty("--oc-h", h0 + "px"); oc.addEventListener("transitionend", function done(e){ if(e.propertyName !== "height") return; oc.removeEventListener("transitionend", done); if(!tile.classList.contains("open")) oc.style.removeProperty("--oc-h"); }); }
  tile.classList.toggle("open", open);
  if(open) spinGlobe(back.querySelector(".globe-full"));
  waveScent(back.querySelector(".sr-back"), open);
  const [fb, bb] = tile.querySelectorAll(".oc-btn");
  fb.setAttribute("aria-expanded", open); fb.tabIndex = open ? -1 : 0; bb.tabIndex = open ? 0 : -1;
  back.setAttribute("aria-hidden", !open); tile.querySelector(".oc-front").setAttribute("aria-hidden", open);
  (open ? bb : fb).focus({preventScroll: true});
}
document.addEventListener("click", e => {
  const b = e.target.closest(".oc-btn");
  if(b){ const t = b.closest(".origin-tile"), open = !t.classList.contains("open");
    /* only one card open at a time: any other open card closes as this one opens */
    document.querySelectorAll(".origin-tile.open").forEach(x => { if(x !== t) originToggle(x, false); });
    originToggle(t, open);
    return; }
  document.querySelectorAll(".origin-tile.open").forEach(t => { if(!t.contains(e.target)) originToggle(t, false); });
});
document.addEventListener("keydown", e => { if(e.key === "Escape") document.querySelectorAll(".origin-tile.open").forEach(t => originToggle(t, false)); });
let SOIL_RO = null;
/* the light arc's legends stay 10.5px on screen whatever size the arc is drawn at: their font is set in the arc's own units,
   scaled by how many of those units fit in a pixel */
let LA_RO = null;
function fitLightArc(){
  const svg = document.querySelector(".light-arc svg"); if(!svg) return;
  const nat = svg.viewBox.baseVal.width, set = () => { const w = svg.getBoundingClientRect().width; if(!w) return; const k = nat/w; svg.style.setProperty("--la-k", k.toFixed(4));
    /* the soft join between track and range uses the temperature meter's 2.2px blur, so the rounded ends stay true pills */
    const g = svg.querySelector("#la-goo feGaussianBlur"); if(g) g.setAttribute("stdDeviation", (2.2*k).toFixed(3));
    /* the hours use exactly the temperature numbers' size, which follows the width of their own tile */
    const tn = document.querySelector(".stats .num.range:not(.none-num)"), hn = svg.parentNode.querySelector(".la-hours.num"); if(tn && hn) hn.style.fontSize = getComputedStyle(tn).fontSize; };
  set(); if(window.ResizeObserver){ if(LA_RO) LA_RO.disconnect(); LA_RO = new ResizeObserver(set); LA_RO.observe(svg); const tt = document.querySelector(".stats .tile"); if(tt) LA_RO.observe(tt); }
}
function fitSoil(){
  const t = document.querySelector(".soil-text"), w = document.querySelector(".soil-potwrap"); if(!t || !w) return;
  const set = () => w.style.setProperty("--pot-h", Math.max(116, t.getBoundingClientRect().height) + "px");

/* the single flower in the Bloom tile: a still picture at three quarters */
function mountBloom(p){

function route(instant){
  if(/^#build/.test(location.hash)){ history.replaceState(null, "", "#" + location.hash.slice(1).replace(/^build-?/, "")); }
  const id = location.hash.slice(1), p = DATA.find(x => slug(x.name) === id);
  requestAnimationFrame(fitType); setTimeout(fitType, 300);   /* refit the big type once the page has drawn */
  const draw = () => {
    if(p){ view.innerHTML = renderPlant(p); fitSoil(); fitLightArc(); mountBloom(p); mountLeaves(p); document.title = "Hoya " + p.name; }
    else { view.innerHTML = renderHome(); bindHome(); document.title = "Hoya Collection"; }
    document.body.dataset.page = (id === "build" || id.startsWith("build-")) ? "build" : p ? "plant" : "home";
    { const hl = document.getElementById("home-link"), home = document.body.dataset.page === "home"; hl.tabIndex = home ? -1 : 0; hl.toggleAttribute("aria-hidden", home); }

/* shrink big type until its longest word fits, so names never break mid-word */
function fitType(){
  document.querySelectorAll(".hero h1, .name-tile h1, .tile-link h3, .pager .nm, .b-title").forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
    while(el.scrollWidth > el.clientWidth + 1 && size > 14 && guard++ < 60){ size -= 2; el.style.fontSize = size + "px"; }
  });
}
