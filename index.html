<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoya Collection</title>
<link rel="preload" href="fonts/clash-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* fonts are bundled with the site, so they always load */
@font-face{font-family:"Clash Grotesk";src:url(fonts/clash-grotesk-var.woff2) format("woff2");font-weight:200 700;font-display:swap}
@font-face{font-family:"Schibsted Grotesk";src:url(fonts/schibsted-grotesk-latin-wght-normal.woff2) format("woff2");font-weight:400 900;font-display:swap}
/* Layout idea: a health-tracker bento. Graphite + signal orange chrome; every Hoya page takes its accent from its own flower color. */
:root{
  --bg:#F0F0F0; --tile:#FFFFFF; --ink:#000000; --muted:#6B6B6B; --line:#D6D6D6; --signal:#F2541B;
  --sunk:#F3F3F3; --husk:#2F2A27;
  --display:"Clash Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:21.6px; --gap:6px;
  --tb:#000000; --tm:46%;   /* titles: a very dark version of the flower color (mixed in OKLCH) */
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --tile:#121212; --ink:#FFFFFF; --muted:#8F8F8F; --line:#2B2B2B; --signal:#FF6630; --sunk:#1C1C1C; --husk:#5E5852;
    --tb:#FFFFFF; --tm:18%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --tile:#121212; --ink:#FFFFFF; --muted:#8F8F8F; --line:#2B2B2B; --signal:#FF6630; --sunk:#1C1C1C; --husk:#5E5852;
  --tb:#FFFFFF; --tm:18%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background-color .45s var(--ease), color .45s var(--ease);
}
a{color:inherit}
.wrap{max-width:1240px; margin:0 auto; padding:16px clamp(16px,3vw,28px) 48px}

/* top bar */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:var(--gap)}
.brand{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-decoration:none; display:flex; align-items:center; gap:8px; transition:color .3s var(--ease)}
.brand:hover{color:var(--ink)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--signal); transition:background-color .45s var(--ease)}
.bar-actions{display:flex; gap:8px; align-items:center}
.btn{
  font:500 13px/1 var(--body); color:var(--ink); background:var(--tile); border:1px solid var(--line);
  border-radius:999px; height:44px; box-sizing:border-box; padding:0 16px; white-space:nowrap; cursor:pointer;   /* as tall as the segmented controls and search fields */ text-decoration:none; display:inline-flex; align-items:center; gap:8px;
  transition:background-color .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease), transform .25s var(--ease);
}
.btn:hover{transform:scale(1.03); border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.tile-link:focus-visible,input:focus-visible,.seg button:focus-visible,.spec a:focus-visible{outline:2px solid var(--signal); outline-offset:2px}
.btn .sf{font-size:14px}
/* icons (inline SVG) */
.sf{display:inline-block; flex:none; height:1em; vertical-align:-.1445em; overflow:visible}   /* inline SVG icons: 1em tall, baseline where the font had it, so they sit like the glyphs did */
/* every icon in the tiles of a Hoya page is drawn at Medium */
/* and at one size, except in the Sources card */
:root{--tile-ico:28px}

/* bento */
.bento{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:var(--gap)}
.tile{
  background:var(--tile); border-radius:var(--r); padding:20px; position:relative; overflow:hidden; min-width:0;
  transition:background-color .45s var(--ease), color .45s var(--ease), box-shadow .3s var(--ease), transform .3s var(--ease);
}
.label{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; transition:color .45s var(--ease)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; font-size:clamp(44px,6.4vw,76px); line-height:.9; letter-spacing:-.04em}
.sub{color:var(--muted); font-size:13px; margin-top:8px; transition:color .45s var(--ease)}
.s3{grid-column:span 3} .s4{grid-column:span 4} .s5{grid-column:span 5} .s6{grid-column:span 6} .s8{grid-column:span 8} .s12{grid-column:span 12}

/* home hero */
.hero h1{
  font-family:var(--display); font-weight:700; font-size:clamp(64px,14vw,200px);
  line-height:.88; letter-spacing:-.025em; margin:0; text-wrap:balance; overflow-wrap:normal; word-break:keep-all;
}
.hero{display:flex; flex-direction:column; justify-content:space-between; gap:28px; min-height:340px}
.hero-foot{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap}
.hero-foot p{margin:0}
.hero p{margin:18px 0 0; color:var(--muted); max-width:46ch; transition:color .45s var(--ease)}

/* spectrum */
.spec{display:flex; gap:3px; height:76px; align-items:stretch}
.spec a{
  flex:1 1 0; border-radius:6px; min-width:0; display:block; position:relative; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  transition:flex-grow .35s var(--ease), transform .35s var(--ease), opacity .35s var(--ease);
}
.spec:hover a{opacity:.55}
.spec a:hover{flex-grow:5; opacity:1}

/* controls */
.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.search{
  flex:1 1 min(260px, 100%); min-width:0; display:flex; align-items:center; gap:10px; background:var(--sunk); border-radius:999px; padding:0 16px; height:44px; box-sizing:border-box;
  transition:background-color .45s var(--ease);
}
.search .sf{font-size:15px; color:var(--muted); flex:none}
.search input{flex:1; border:0; background:transparent; color:var(--ink); font:inherit; padding:0; height:100%; outline:none; min-width:0; transition:color .45s var(--ease)}
.seg{display:flex; align-items:center; height:44px; box-sizing:border-box; background:var(--sunk); border-radius:999px; padding:4px; gap:2px; transition:background-color .45s var(--ease)}
.seg button{
  border:0; background:transparent; color:var(--muted); font:500 13px/1 var(--body); height:36px; padding:0 14px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center;
  transition:background-color .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--tile); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.count{font-family:var(--mono); font-size:12px; color:var(--muted)}

/* index grid */
.grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--gap); margin-top:var(--gap)}
/* hovering grows a tile very slightly rather than moving it, so it never slides out from under the cursor and flickers */
.tile-link{text-decoration:none; display:flex; flex-direction:column; gap:14px; min-height:220px; cursor:pointer; will-change:transform; -webkit-backface-visibility:hidden; backface-visibility:hidden}
.tile-link:hover{transform:scale(1.015); background:var(--c, var(--ink)); color:var(--on, var(--tile))}
.tile-link:hover .origin-mini,.tile-link:hover .pill,.tile-link:hover .label{color:inherit}
.tile-link:hover .segs i{background:currentColor; opacity:.25}
.tile-link:hover .segs i.on{opacity:1}
.tile-link:hover .art{filter:brightness(1.5) saturate(.85); opacity:1}
.tile-link .art{width:72px; height:72px; transition:filter .35s var(--ease), opacity .35s var(--ease)}
.swatch{width:100%; height:6px; border-radius:3px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); background:var(--c, var(--line)); transition:background-color .45s var(--ease), opacity .3s var(--ease)}
.tile-link:hover .swatch{opacity:0}
.tile-link h3{font-family:var(--display); font-weight:700; font-size:28px; line-height:1.02; margin:0; letter-spacing:-.005em; overflow-wrap:normal; word-break:keep-all}
.tile-link .meta{margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; gap:8px}
.tile-link .meta .pill{margin-left:auto; flex:none}
.origin-mini{min-width:0; font-size:12px; color:var(--muted); line-height:1.35; transition:color .45s var(--ease)}
.pill{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:5px 9px; border-radius:999px; white-space:nowrap; border:1px solid currentColor; transition:color .45s var(--ease), background-color .45s var(--ease)}
.pill.alive{color:var(--ink)}
.pill.dead{color:var(--muted); border-style:dashed}
/* status as an icon: a potted plant for growing plants, a skull for lost ones, with no outline */
.pill.status{display:inline-grid; place-items:center; width:auto; height:auto; padding:0; border:0}
.pill.status .sf{font-size:20px}
.segs{display:flex; gap:3px}
.segs i{width:10px; height:4px; border-radius:2px; background:var(--line); transition:background-color .45s var(--ease), opacity .3s var(--ease)}
.segs i.on{background:var(--ink)}
.is-dead{background:var(--sunk)}
.is-dead .art{filter:grayscale(1); opacity:.6}
.grid-head{grid-column:1/-1; padding:22px 4px 4px}
.grid-head .label{margin:0}
.empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0}

/* plant page */
.name-tile{background:var(--name-bg, var(--acc));   /* a little darker and richer than the page accent (nameColors) */ color:var(--on); min-height:360px; display:flex; flex-direction:column; justify-content:space-between; gap:24px;
  position:relative; overflow:hidden; isolation:isolate}
.name-tile .label{color:var(--on); opacity:.72}
/* the umbel at three quarters, very large, behind the name; the tile crops it */
.name-tile > :not(.name-umbel){position:relative; z-index:1}
.name-umbel{position:absolute; z-index:0; top:50%; right:-12%; width:min(200%, 1000px); aspect-ratio:1; pointer-events:none;
  transform:translate(calc(var(--hx, 0) * 45%), calc(-68% - var(--hy, 0) * 45%)); transition:transform .35s var(--ease)}   /* Across and Up and down, from the builder */
.name-umbel .art{display:block; position:relative; width:100%; height:100%}
/* the umbel is its own layer, so it carries the tile color underneath for the shadows to blend into */
.name-umbel::before{content:""; position:absolute; inset:0; background:var(--name-bg, var(--acc))}
.nu-sh{position:absolute; inset:0; width:100%; height:100%; filter:url(#nu-shadow); -webkit-filter:url(#nu-shadow); translate:1.5% 20%; scale:.8}   /* shape, blur, strength and grain all in the SVG filter (see body); the offset is in translate, since the fade-in animates opacity and transform */
.nu-mul{mix-blend-mode:multiply}
.nu-ovl{mix-blend-mode:overlay}
.name-tile h1{
  font-family:var(--display); font-weight:700; font-size:clamp(64px,12vw,168px);
  line-height:.85; letter-spacing:-.015em; margin:0; overflow-wrap:normal; word-break:keep-all; text-wrap:balance;
}
.name-tile .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.name-tile .pill{color:var(--on)}
.name-tile > .pill.status{position:absolute; top:20px; right:20px}   /* same distance from the top and right edges as the tile's padding */
.name-tile .pill.status .sf{display:block; font-size:15px; opacity:.72}   /* sized and tinted like the "No. 01 of 85" line beside it */
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:1fr; gap:var(--gap); min-width:0}
/* the stat tiles share their row's height evenly: icon at the top, the value and its scale settle at the bottom,
   and the figures grow to use the room */
.stats.s12{grid-template-columns:repeat(4,minmax(0,1fr))}   /* full width: the four readings in one row */
.stats.s12 > .tile{min-height:164px}
@media (max-width:900px){ .stats.s12{grid-template-columns:repeat(2,minmax(0,1fr))} }
.stats .tile{padding:18px; display:flex; flex-direction:column; min-height:0; container-type:inline-size}
.stats .tile > .label + *, .stats .tile > .stat-ico + *, .stats .tile > .stat-unit + *{margin-top:auto}   /* icon at the top, the reading at the bottom */
.stats .num{font-size:clamp(28px,26cqi,64px); white-space:nowrap}   /* sized to the tile, so ranges like 18–28 ºC always fit */
.stats .word{font-size:clamp(24px,2.6vw,38px); line-height:1.02; overflow-wrap:anywhere}
.stats .word.fit{white-space:nowrap; overflow-wrap:normal}
/* stat ranges: the active range is 14px tall, over a 6px base track centered behind it. The two melt together
   (the goo filter, see body): the track swells into the range with soft inward curves, and their colors blend there */
/* the track is drawn twice: crisp underneath, so its ends stay truly round, and again inside .goo with the range,
   where the goo filter melts the two together */
.stats .meter{margin-top:14px; height:14px; background:none; overflow:visible}
.stats .meter .goo{position:absolute; inset:0; z-index:3; filter:url(#meter-goo); -webkit-filter:url(#meter-goo)}
.stats .meter .goo::after{content:""; position:absolute; left:0; right:0; top:4px; height:6px; border-radius:999px; background:var(--sunk); transition:background-color .45s var(--ease)}
.stats .meter.temp .goo::before{content:""; position:absolute; left:0; right:0; top:4px; height:6px; border-radius:999px; background:var(--temp-grad); opacity:.22; z-index:1}
.stats .meter.hum .goo::before{content:""; position:absolute; left:0; right:0; top:4px; height:6px; border-radius:999px; background:var(--hum); opacity:.22; z-index:1; transition:background-color .45s var(--ease)}
.stats .meter::after{content:""; position:absolute; left:0; right:0; top:4px; height:6px; border-radius:999px; background:var(--sunk); transition:background-color .45s var(--ease)}
.stats .meter.temp::before, .stats .meter.hum::before{top:4px; bottom:auto; height:6px; border-radius:999px; z-index:1}
.stats .meter b{position:absolute; z-index:2; border-radius:7px; corner-shape:round}   /* a true pill */
.stats .meter.temp{background:none}   /* only the thin track shows behind the range, not a full-height box */
.stats .sub{margin-top:6px}
.bloom-body{display:grid; grid-template-columns:minmax(160px,42%) minmax(0,1fr); gap:24px; align-items:center; height:100%}   /* the flower stands in for the icon, the notes beside it */
.soil-tile{display:flex; flex-direction:column}
/* the pot scales with the tile: as tall as the tile's content, its width following its own proportions */
.soil-body{flex:1; min-height:0; display:flex; gap:18px; align-items:flex-start}
/* the pot is exactly as tall as the text beside it (measured, see fitSoil), so the text always sets the box's height */
.soil-potwrap{position:relative; flex:none; height:var(--pot-h, 160px); aspect-ratio:72/116}
.soil-text{min-width:0; flex:1; display:flex; flex-direction:column}
.soil-text .soil-key{margin-top:auto; padding-top:12px; padding-bottom:8px}   /* the key sits low, its last line level with the pot's outline (inset 4/116 of the pot), clear of the tile padding */
.soil-pot{position:absolute; inset:0; width:100%; height:100%; color:var(--acc-meter, var(--ink));   /* the outline: the flower's tint, faint */ transition:color .45s var(--ease)}
.soil-key{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:3px; font:11px var(--mono); color:var(--muted); transition:color .45s var(--ease)}
.soil-key li{display:flex; align-items:center; gap:7px}
.soil-key i{width:8px; height:8px; border-radius:50%; flex:none}
.soil-key span{margin-left:auto; font-variant-numeric:tabular-nums}
.bloom-tile{background:var(--acc-soft)}   /* tinted like the umbel tile */
.bloom-3d{position:relative; aspect-ratio:1; width:100%}
.bloom-canvas{position:absolute; inset:0; width:100%; height:100%}
@media (max-width:640px){ .bloom-body{grid-template-columns:1fr} .bloom-3d{max-width:280px; justify-self:center} }
.art-tile{display:grid; place-items:center; background:var(--acc-soft); min-height:360px; overflow:hidden}
.art-tile .art{width:min(78%,260px); height:auto; aspect-ratio:1; scale:1.45}   /* drawn larger than its slot: the picture's empty margin overflows (clipped), the box keeps its size */
.leaf-pair .bloom-canvas{scale:1.32}
.leaf-tile .bloom-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}   /* two even columns: the stem and its leaves, and the notes */
@media (max-width:640px){ .leaf-tile .bloom-body{grid-template-columns:1fr} }   /* 20% larger; the picture's clear margins spill past its slot, not the leaves */
.leaf-tile{background:color-mix(in oklch, var(--leaf) 20%, var(--tile))}   /* tinted with the leaves' own green */
.art-cap{position:absolute; left:20px; right:20px; bottom:16px; font-family:var(--mono); font-size:11px; color:var(--muted)}
.meter{height:8px; border-radius:999px; background:var(--sunk); position:relative; margin-top:16px; overflow:hidden; transition:background-color .45s var(--ease)}
.meter b{position:absolute; top:0; bottom:0; border-radius:999px; background:var(--acc-meter)}
/* temperature: the whole 0 to 40 ºC scale is a cold-to-hot gradient, faint; the range this Hoya
   tolerates is the same gradient at full strength, lined up with the scale behind it */
.meter.temp{--temp-grad:linear-gradient(90deg in oklch, #3F6FD8 0%, #48A9C8 22%, #8CC46A 45%, #F0BE45 64%, #EC8436 80%, #D63A2C 100%); background:var(--sunk)}
.meter.temp::before{content:""; position:absolute; inset:0; background:var(--temp-grad); opacity:.22}
.meter.temp b{background-image:var(--temp-grad); background-repeat:no-repeat}
/* humidity: always water blue, whatever the flower color */
.meter.hum{--hum:#3395FF}
:root[data-theme="dark"] .meter.hum{--hum:#007AFF}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .meter.hum{--hum:#007AFF} }
.meter.hum b{background:var(--hum); transition:background-color .45s var(--ease)}
/* the rest of the humidity track takes a faint tint of the same blue, as the temperature track does with its colors */
.meter.hum::before{content:""; position:absolute; inset:0; background:var(--hum); opacity:.22; transition:background-color .45s var(--ease)}
.scale{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:6px}
.word.none{font-size:clamp(24px,2.6vw,32px); color:var(--muted)}
.word{font-family:var(--display); font-weight:700; font-size:clamp(36px,4.6vw,60px); line-height:1}
.notes h2{font-family:var(--display); font-weight:700; font-size:28px; margin:0 0 10px; display:flex; align-items:center; gap:10px}
.notes h2 .fi{font-size:var(--tile-ico); flex:none; color:var(--acc-meter); transition:color .45s var(--ease)}
.stat-ico{margin:0 0 10px; line-height:0}
.stats .tile:has(.stat-unit) .stat-ico .fi{font-size:15px; line-height:15px}   /* temperature and humidity: the icon as tall as the unit line beside it */
/* origin: a card that flips over, lifts and opens out to the full list of places */
.stats .origin-tile{--oc-ease:cubic-bezier(.22, 1, .36, 1); padding:0; background:none; overflow:visible; perspective:1400px; z-index:1}
.stats .origin-tile.open{z-index:30}
.oc{position:absolute; left:0; right:0; top:0; height:var(--oc-h, 100%); border-radius:var(--r); transform-style:preserve-3d;
  transition:transform .7s var(--oc-ease), height .6s var(--oc-ease)}   /* eased out: quick to start, settling softly */
.origin-tile.open .oc{transform:translateY(-8px) scale(1.03) rotateY(180deg)}
.oc-face{position:absolute; inset:0; padding:18px; display:flex; flex-direction:column; background:var(--tile); border-radius:var(--r); overflow:hidden;
  -webkit-backface-visibility:hidden; backface-visibility:hidden; box-shadow:0 0 0 rgba(0,0,0,0); transition:background-color .45s var(--ease), box-shadow .6s var(--oc-ease)}
.oc-front > .stat-ico + *{margin-top:auto}
.oc-front .word{margin-top:auto}
.oc-back{transform:rotateY(180deg)}   /* in dark mode the back is a step lighter than the tiles (below) */
:root[data-theme="dark"] .oc-back{background:color-mix(in oklch, var(--tile) 84%, #FFFFFF 16%)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .oc-back{background:color-mix(in oklch, var(--tile) 84%, #FFFFFF 16%)} }
.origin-tile.open .oc-face{box-shadow:0 20px 50px rgba(0,0,0,.12), 0 3px 10px rgba(0,0,0,.05)}
.oc-btn{position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; border:0; background:var(--sunk); color:color-mix(in oklch, var(--hue) var(--tm), var(--tb)); cursor:pointer;
  display:grid; place-items:center; transition:background-color .3s var(--ease), color .45s var(--ease), transform .25s var(--ease)}
.oc-btn:hover{transform:scale(1.08)} .oc-btn:active{transform:scale(.94)}
.oc-btn i, .oc-btn i::before{display:block; width:12px; height:2px; border-radius:1px; background:currentColor}
.oc-btn i{position:relative; transition:transform .45s var(--oc-ease, var(--ease))}
.oc-btn i::before{content:""; position:absolute; inset:0; transform:rotate(90deg)}
.oc-back .oc-btn i{transform:rotate(45deg)}   /* on the back the plus is turned into a close mark */
.oc-list{list-style:none; margin:4px 0 0; padding:0; display:grid; gap:6px; font:400 16px/1.3 var(--body);
  color:color-mix(in oklch, var(--hue) var(--tm), var(--tb)); transition:color .45s var(--ease)}
.oc-back .sub{margin-top:12px}
.stat-unit{position:absolute; top:18px; right:18px; font:600 15px/1 var(--mono); color:var(--muted); transition:color .45s var(--ease)}
.num.range{display:flex; align-items:center; gap:10px; font-family:"SF Compact Rounded", "SF Compact Rounded Text", ui-rounded, var(--mono); letter-spacing:-.02em}   /* installed on this device */
.num.range > span:last-child:not(:first-child){margin-left:auto}
.range-dash{flex:1; display:flex; justify-content:center}
.range-dash::before{content:""; width:min(100%, 22px); height:6px; border-radius:3px; background:var(--line); transition:background-color .45s var(--ease)}
.stat-ico .fi{font-size:var(--tile-ico); color:var(--acc-meter, currentColor); transition:color .45s var(--ease)}

.notes p{margin:0 0 10px; max-width:62ch}

.links{display:flex; flex-direction:column; gap:10px}
.links a{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; background:var(--sunk); text-decoration:none; transition:background-color .35s var(--ease), transform .25s var(--ease)}

.pager{display:flex; gap:var(--gap); margin-top:var(--gap)}

/* flower builder */
/* the hoya picker sits in the top right corner at a fixed width, so the name below never moves it */
.b-head{display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"lab pick" "title title"; align-items:center; column-gap:20px; row-gap:18px}
.b-head > .label{grid-area:lab; margin:0}
.b-head .b-title{grid-area:title; min-width:0}
.b-head .b-pick{grid-area:pick; justify-self:end}
.b-pick .select{width:260px} .b-pick select{width:100%; height:44px; text-overflow:ellipsis; white-space:nowrap; overflow:hidden}
@media (max-width:640px){ .b-head{grid-template-columns:minmax(0,1fr); grid-template-areas:"lab" "pick" "title"} .b-head .b-pick{justify-self:stretch} .b-pick .select{flex:1; width:auto; min-width:0} }
.b-title{font-family:var(--display); font-weight:700; font-size:clamp(48px,8vw,112px); line-height:.85; margin:0; letter-spacing:-.02em}
.b-pick{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.b-pick .label{margin:0}
/* dropdowns: the browser's arrow is replaced by a small chevron of our own, centered in the space at the right */
.select{position:relative; display:inline-flex; align-items:center}
.select::after{content:""; position:absolute; right:17px; top:50%; width:6px; height:6px; margin-top:-5px; border-right:1.6px solid currentColor; border-bottom:1.6px solid currentColor;
  transform:rotate(45deg); pointer-events:none; color:var(--muted); transition:color .45s var(--ease)}
select{-webkit-appearance:none; appearance:none; box-sizing:border-box; font:500 14px var(--body); color:var(--ink); background:var(--sunk); border:1px solid var(--line); border-radius:999px; padding:0 40px 0 16px; cursor:pointer; transition:background-color .45s var(--ease), color .45s var(--ease), border-color .45s var(--ease)}
.b-stage{display:grid; place-items:center; min-height:420px; background:color-mix(in srgb, var(--acc) 22%, var(--tile)); transition:background-color .45s var(--ease)}
.b-stage .art{width:min(86%,440px); height:auto; aspect-ratio:1}
.b-single .art{width:min(80%,240px)}
.art3d{display:block}
.art-wait{display:block; aspect-ratio:1}
.art-in{animation:artIn .45s var(--ease) both}
@keyframes artIn{from{opacity:0; transform:scale(.97)} to{opacity:1; transform:none}}
/* the Name box tab swaps the flower stages for the name box preview; whichever appears eases in */
.builder:not(.mode-hero) .b-hero, .builder.mode-hero .b-stage, .builder.mode-hero .b-photo{display:none}
.builder:not(.mode-leaf) .b-leafv, .builder.mode-leaf .b-umbel, .builder.mode-leaf .b-single{display:none}
.builder.mode-hero .b-hero, .builder:not(.mode-hero) .b-stage, .builder:not(.mode-hero) .b-photo{animation:artIn .45s var(--ease) both}
.builder .b-leafv{background:color-mix(in oklch, var(--leaf, #4A7A22) 20%, var(--tile))}   /* tinted with the leaf's own green, as on the hoya pages */
.b-leafv canvas{position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none}
.b-leafv canvas.grab{cursor:grabbing}
/* the previews hold their place at the top of the window while the controls scroll underneath; they share the page's
   12 columns, and get shorter so the controls keep room */
.b-previews{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:var(--gap); position:sticky; top:0; z-index:5;
  margin:calc(var(--gap) * -1) calc(var(--gap) * -1) 0; padding:var(--gap); background:var(--bg); transition:background-color .45s var(--ease)}
.b-previews .b-stage, .b-previews .b-photo{min-height:clamp(220px, 36vh, 420px)}
.b-previews .b-hero{min-height:clamp(220px, 36vh, 360px)}
@media (max-width:900px){ .b-previews{position:static; margin:0; padding:0; background:none} }
.b-umbel canvas{position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none}
.b-umbel canvas.grab{cursor:grabbing}
.b-single canvas{position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none}
.b-single canvas.grab{cursor:grabbing}
.v3d-bar{position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:center; gap:8px; pointer-events:none}
.v3d-bar > *{pointer-events:auto}
.v3d-views{background:color-mix(in srgb, var(--tile) 70%, transparent)}

.v3d-wire{font-size:12px}

.b-photo{padding:0; min-height:420px; background:var(--sunk)}
.b-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.b-photo .art-cap{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ctl{margin-top:14px}
.ctl-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:14px; font-weight:500}
.ctl-top output{font:12px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; margin:8px 0 0; accent-color:var(--ink); height:22px}
.grad-row{display:grid; grid-template-columns:70px 1fr; align-items:center; gap:12px; font-size:13px; color:var(--muted)}
.grad-row i{display:block; height:28px; border-radius:999px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); transition:background .3s var(--ease)}
.b-edit{display:flex; flex-direction:column; gap:18px}
.seg-slide{position:relative; align-self:flex-start; max-width:100%; overflow-x:auto}
.seg-slide button{position:relative; z-index:1; background:transparent !important; box-shadow:none !important}
.seg-slide button[aria-selected="true"]{color:var(--ink)}
.seg-thumb{position:absolute; top:4px; bottom:4px; left:4px; width:0; border-radius:999px; background:var(--tile); box-shadow:0 1px 3px rgba(0,0,0,.12);
  transition:transform .42s var(--ease), width .42s var(--ease), background-color .45s var(--ease)}
.b-panel{margin-top:16px; transition:height .42s var(--ease)}
.b-panel-in{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:28px; align-items:start; animation:panelIn .42s var(--ease) both}
@keyframes panelIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.b-fields{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:22px 24px; align-items:start}
.b-group{border:0; margin:0; padding:0; min-width:0}
.b-group legend{padding:0; margin-bottom:4px}
.b-group .ctl{margin-top:10px}
.b-group .ctl:first-of-type{margin-top:4px}
.b-group .ctl-top{font-size:13px}
.b-group input[type=range]{margin-top:4px}
/* builder sliders: a gray track with a slightly lighter outline, filled in ink up to the thumb (--p) */
@property --p{syntax:"<percentage>"; inherits:true; initial-value:0%}
.ctl{--trk:color-mix(in oklch, var(--ink) 13%, var(--tile)); --trk-edge:color-mix(in oklch, var(--trk) 88%, #fff)}
.ctl input[type=range]{-webkit-appearance:none; appearance:none; background:transparent; height:22px; cursor:pointer;
  transition:--p .25s var(--ease)}
.ctl input[type=range]:active{transition:none}
.ctl input[type=range]::-webkit-slider-runnable-track{height:8px; box-sizing:border-box; border-radius:999px; border:1px solid var(--trk-edge);
  background:linear-gradient(90deg, var(--ink) var(--p), var(--trk) var(--p)); transition:border-color .45s var(--ease)}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:16px; height:16px; margin-top:-5px; border-radius:50%; background:var(--ink); border:0;
  transition:transform .2s var(--ease)}
.ctl input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.ctl input[type=range]::-moz-range-track{height:8px; box-sizing:border-box; border-radius:999px; border:1px solid var(--trk-edge); background:var(--trk)}
.ctl input[type=range]::-moz-range-progress{height:8px; border-radius:999px; background:var(--ink)}
.ctl input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--ink); border:0; transition:transform .2s var(--ease)}
.ctl input[type=range]:active::-moz-range-thumb{transform:scale(1.15)}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.b-colors{display:grid; gap:10px}
.b-colors .label{margin:0}
.b-colors .grad-row{display:block}
@property --s0{syntax:"<number>"; inherits:true; initial-value:0}
@property --s1{syntax:"<number>"; inherits:true; initial-value:1}
@property --s2{syntax:"<number>"; inherits:true; initial-value:1}
.gstops{position:relative; transition:--s0 .22s var(--ease), --s1 .22s var(--ease), --s2 .22s var(--ease)}
.gstops i{display:block; height:28px; border-radius:999px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.gstop{position:absolute; top:3px; left:0; width:22px; height:22px; margin-left:-11px; padding:0; border:0; border-radius:50%; cursor:grab; touch-action:none;
  box-shadow:0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.3); transition:left .22s var(--ease), background-color .3s var(--ease), box-shadow .25s var(--ease), transform .2s var(--ease)}
.gstop[aria-pressed="true"]{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink), 0 1px 4px rgba(0,0,0,.3)}
.gstop:hover{transform:scale(1.08)}
.gstop:focus-visible{outline:none; box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink), 0 0 0 7px rgba(0,0,0,.12)}
.gstops.dragging, .gstops.dragging .gstop{transition:none}
.gstops.dragging .gstop{cursor:grabbing}
.gstops-out{display:flex; justify-content:space-between; margin:6px 0 0; font-size:12px; color:var(--muted)}
.b-colors-head{display:flex; justify-content:space-between; align-items:center; gap:8px}
.gmid{position:relative; width:26px; height:26px; padding:0; border:1px solid color-mix(in oklch, var(--ink) 22%, var(--tile)); border-radius:50%; background:transparent; color:var(--ink); cursor:pointer;
  transition:background-color .3s var(--ease), border-color .3s var(--ease), transform .2s var(--ease)}
.gmid:hover{background:var(--sunk); border-color:color-mix(in oklch, var(--ink) 40%, var(--tile))}
.gmid:active{transform:scale(.92)}
.gmid:focus-visible{outline:2px solid var(--signal); outline-offset:2px}
.gmid i{position:absolute; left:50%; top:50%; width:10px; height:1.25px; margin:-.625px 0 0 -5px; border-radius:1px; background:currentColor}
.gmid i + i{transform:rotate(90deg)}
.gmid.on i + i{transform:rotate(90deg) scaleX(0)}
.gmid.to-minus i + i{animation:gmidMinus .35s var(--ease) both}
.gmid.to-plus i + i{animation:gmidPlus .35s var(--ease) both}
@keyframes gmidMinus{from{transform:rotate(90deg) scaleX(1)} to{transform:rotate(90deg) scaleX(0)}}
@keyframes gmidPlus{from{transform:rotate(90deg) scaleX(0)} to{transform:rotate(90deg) scaleX(1)}}
.gstops-out output{font:12px var(--mono); font-variant-numeric:tabular-nums}
.swatches{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px}
@media (max-width:900px){ .b-panel-in{grid-template-columns:1fr} .b-who{text-align:left} }
/* the reset opens out under the page accent swatch (rows 0fr to 1fr, so the height eases) */
.swatch-wrap{display:grid; grid-template-rows:auto 0fr; transition:grid-template-rows .3s var(--ease)}
.swatch-wrap.on{grid-template-rows:auto 1fr}
.sw-reset-box{overflow:hidden; min-height:0}
.sw-reset{width:100%; justify-content:center; margin-top:6px; height:36px; font-size:12px;
  opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .25s var(--ease), transform .3s var(--ease), background-color .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease)}
.swatch-wrap.on .sw-reset{opacity:1; transform:none; pointer-events:auto}
.swatch-wrap.on .sw-reset:hover{transform:scale(1.02)}
.swatch-wrap.on .sw-reset:active{transform:scale(.98)}
.swatch-ctl{display:flex; gap:10px; align-items:center; text-align:left; width:100%; background:var(--sunk); color:var(--ink); border:0; border-radius:14px; padding:7px; cursor:pointer; font:500 13px var(--body);
  box-shadow:inset 0 0 0 2px transparent; transition:background-color .35s var(--ease), color .45s var(--ease), box-shadow .3s var(--ease), transform .25s var(--ease)}
.swatch-ctl:active{transform:scale(.98)}
.swatch-ctl[aria-pressed="true"]{background:var(--tile); box-shadow:inset 0 0 0 2px var(--ink)}
.swatch-ctl i{width:34px; height:34px; border-radius:10px; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); transition:background-color .3s var(--ease)}
.swatch-ctl small{display:block; font:11px var(--mono); color:var(--muted); transition:color .45s var(--ease)}
.picker{background:var(--sunk); border-radius:18px; padding:16px; transition:background-color .45s var(--ease)}
.pk-top{display:flex; gap:14px; align-items:center; margin-bottom:6px}
.pk-auto{margin-left:auto; flex:none} .pk-auto[hidden]{display:none}
.pk-chip{width:64px; height:64px; border-radius:16px; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); transition:background-color .3s var(--ease)}
.pk-id{display:grid; gap:4px; font-size:14px; font-weight:500; min-width:0}
.pk-id small{font:11px var(--mono); color:var(--muted); transition:color .45s var(--ease)}
.pk-hex{display:flex; align-items:center; gap:8px; font:11px var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.pk-hex input{width:96px; height:30px; padding:0 10px; border-radius:999px; border:1px solid var(--line); background:var(--tile); color:var(--ink); font:13px var(--mono); text-transform:uppercase;
  transition:border-color .3s var(--ease), background-color .45s var(--ease), color .45s var(--ease), box-shadow .3s var(--ease)}
.pk-hex input:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--ink) 12%, transparent)}
.pk-row{margin-top:12px}
input.pk-range{-webkit-appearance:none; appearance:none; width:100%; height:26px; margin:8px 0 0; border-radius:999px; background:var(--track); box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); cursor:pointer; accent-color:auto}
input.pk-range::-webkit-slider-runnable-track{height:26px; border-radius:999px; background:transparent}
input.pk-range::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%; background:var(--thumb); border:3px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.25); transition:transform .2s var(--ease), background-color .2s var(--ease)}
input.pk-range:active::-webkit-slider-thumb{transform:scale(1.15)}
input.pk-range::-moz-range-track{height:26px; border-radius:999px; background:transparent}
input.pk-range::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:var(--thumb); border:3px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.25); transition:transform .2s var(--ease)}
input.pk-range:active::-moz-range-thumb{transform:scale(1.15)}
input.pk-range:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

.b-top{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.b-save{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.b-save .btn{padding:0 16px; font-size:13px}
.b-status{font:600 13px var(--body); margin:0 6px 0 0; white-space:nowrap; transition:color .45s var(--ease)}

.b-who.on{max-height:40px; opacity:1; margin-top:6px}
.b-status[data-state="dirty"]{color:var(--signal)}
.btn.primary{background:var(--ink); color:var(--tile); border-color:var(--ink)}

/* view transition */
#view{transition:opacity .38s var(--ease), transform .38s var(--ease)}
#view.leaving{opacity:0; transform:translateY(10px)}

@media (max-width:900px){
  .s3{grid-column:span 6} .s4,.s5,.s8{grid-column:span 12} .s6{grid-column:span 12}
}
/* boxes always hug what's in them: where a row gets too narrow for its content, the layout changes instead */
/* Light and Water share a row; Soil and Blooming share the next. Where Soil gets too narrow for its pot and key,
   it gives Blooming less of the row, and below that each takes a full row */

  .pager{flex-direction:column}   /* previous and next stack, so long names fit */

  /* the builder's five tabs wrap onto two rows on phones, keeping one rounded control */
  #b-seg{flex-wrap:wrap; height:auto; row-gap:2px; border-radius:22px; align-self:stretch}
  #b-seg button{flex:1 1 auto; justify-content:center; white-space:nowrap}
  #b-seg .seg-thumb{bottom:auto}
    .s3{grid-column:span 12}

}

  *,*::before,*::after{transition-duration:.01ms !important}
}

/* Apple-style continuous corners (corner smoothing). Each corner keeps the same visual radius: the curve
   eases in over 1.45x the distance, like a 45% corner smoothing, and the superellipse is chosen so the
   corner cuts in exactly as deep as the old round one at 45 degrees. Circles stay round.
   Browsers without corner-shape keep the plain rounded corners. */
@supports (corner-shape: squircle){
  .tile{border-radius:calc(var(--r) * 1.45); corner-shape:superellipse(1.62)}
  .oc, .oc-face{border-radius:calc(var(--r) * 1.45); corner-shape:superellipse(1.62)}   /* the origin card and both its faces match the other boxes */
  .spec a{border-radius:8.7px; corner-shape:superellipse(1.62)}
  .links a{border-radius:20.3px; corner-shape:superellipse(1.62)}
  .swatch-ctl{border-radius:20.3px; corner-shape:superellipse(1.62)}
  .swatch-ctl i{border-radius:14.5px; corner-shape:superellipse(1.62)}
  .picker{border-radius:26.1px; corner-shape:superellipse(1.62)}
  .pk-chip{border-radius:23.2px; corner-shape:superellipse(1.62)}
  .segs i{border-radius:2.9px; corner-shape:superellipse(1.62)}
  .swatch{border-radius:4.4px; corner-shape:superellipse(1.62)}
  /* pills: each end keeps its full half-height curve, and the smoothing eases in along the straight sides
     over 1.08x that, much less than the tiles, as Figma does with smoothing on a pill (horizontal radius / vertical radius) */
  .btn{border-radius:23.9px / 50%; corner-shape:superellipse(1.15)}   /* 44px tall, like the search fields and segmented controls */
  .sw-reset{border-radius:19.4px / 50%}
  .search, .seg{border-radius:23.9px / 50%; corner-shape:superellipse(1.15)}
  .seg button, .seg-thumb{border-radius:19.4px / 50%; corner-shape:superellipse(1.15)}
  select{border-radius:23.9px / 50%; corner-shape:superellipse(1.15)}
  .pill:not(.status){border-radius:11.9px / 50%; corner-shape:superellipse(1.15)}
  .meter, .meter b{border-radius:5.2px / 50%; corner-shape:superellipse(1.15)}
  .months i{border-radius:11.9px / 50%; corner-shape:superellipse(1.15)}
  .gstops i, .grad-row i{border-radius:14.9px / 50%; corner-shape:superellipse(1.15)}
  .pk-hex input{border-radius:16.4px / 50%; corner-shape:superellipse(1.15)}
  input.pk-range, input.pk-range::-webkit-slider-runnable-track{border-radius:14.1px / 50%; corner-shape:superellipse(1.15)}

/* title color: each plant's own flower color, taken very dark (very light in dark mode) */
.bento{--hue:var(--acc, var(--ink))}
.tile-link{--hue:var(--c, var(--ink))}
.tile-link h3, .pager .nm, .notes h2, .word, .b-title, .num.range, .stat-unit, .b-status:not([data-state="dirty"]){
  color:color-mix(in oklch, var(--hue) var(--tm), var(--tb)); transition:color .45s var(--ease)}
.tile-link:hover h3, .tile-link:hover .nm{color:inherit}
.stat-unit{opacity:.55}   /* the unit takes the title tint too, but quieter than the numbers */
.word.none{color:color-mix(in oklch, var(--hue) 45%, var(--muted))}   /* "No data": muted, but tinted with the flower color */

/* blooming months */
.season{display:flex; flex-direction:column}
.season .word{font-size:clamp(24px,2.4vw,34px); margin:2px 0 14px}
.months{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:3px; margin-top:auto}
.months span{display:grid; gap:6px; justify-items:center}
.months i{display:block; width:100%; height:22px; border-radius:999px; background:var(--sunk); transition:background-color .45s var(--ease)}
.months .on i{background:var(--acc-meter)}
.months small{font:10.5px var(--mono); color:var(--muted)}
.months .on small{color:var(--ink)}
.season .sub{margin:12px 0 0}
.season .word.none{font-style:normal; color:color-mix(in oklch, var(--hue) 45%, var(--muted))}

/* brand link: plain on the home page, with a back arrow everywhere else */
.brand .back{display:none; font-size:13px; line-height:0; transition:transform .3s var(--ease)}
body:not([data-page="home"]) .brand .back{display:inline-block}
.brand:hover .back{transform:translateX(-3px)}

.seg button .ct{font-family:var(--mono); font-size:11px; margin-left:6px; opacity:.55; transition:opacity .3s var(--ease)}
.seg button[aria-pressed="true"] .ct{opacity:.8}
</style>

function gradsFor(p){
  const col = COLORS[p.name];
  if(!col) return null;
  const g = GRAD[p.name];
  if(g) return g;
  const corona = lum(col) > .45 ? mix(col,"#4A1420",.55) : mix(col,"#FFFFFF",.72);
  /* single-color plants still get a soft center-to-tip shift */
  return {outer:[mix(col,"#FFFFFF",.18), col], inner:[mix(corona,"#000000",.1), corona]};
}

/* flower count and size, read from the bloom and care notes */
function flowerInfo(p){
  const t = (p.bloom + " \n " + p.care).toLowerCase();
  let count = null, countSrc = null, m;
  const rangeRe = /(\d{1,2})\s*(?:-|to)\s*(\d{1,2})\s*(?:flowers|per (?:cluster|umbel)|pinkish|tiny|small|waxy)/;
  const ofRe = /(?:clusters?|balls?|umbels?) of (?:about |up to )?(\d{1,2})(?:\s*-\s*(\d{1,2}))?/;
  const upRe = /up to (\d{1,2})\s*(?:tiny |small |large )?(?:[a-z ]{0,30})?flowers/;
  if((m = t.match(ofRe)) || (m = t.match(rangeRe))){
    const a = +m[1], b = m[2] ? +m[2] : a; count = Math.round((a+b)/2); countSrc = a===b ? `${a} per umbel` : `${a}–${b} per umbel`;
  } else if((m = t.match(upRe))){
    count = +m[1]; countSrc = `up to ${m[1]} per umbel`;
  }
  let size = null, sizeSrc = null;
  const cmRe = /(?:about |up to )?(\d+(?:\.\d+)?)(?:\s*-\s*(\d+(?:\.\d+)?))?\s*cm/g;
  while((m = cmRe.exec(t))){
    const before = t.slice(Math.max(0, m.index-25), m.index);
    if(/peduncle|stem|leaves|leaf|wide\)/.test(before)) continue;
    const near = t.slice(Math.max(0, m.index-40), m.index+60);
    if(!/flower/.test(near)) continue;
    const v = m[2] ? (+m[1] + +m[2]) / 2 : +m[1];
    size = v < 1 ? 0.55 : v < 2 ? 1 : v < 3.5 ? 1.35 : 1.7; sizeSrc = `${m[0].trim()} flowers`; break;
  }
  if(size === null){
    /* a size word counts only when it describes the flowers, not the leaves, vine or peduncles */
    const words = {"huge":1.7,"massive":1.7,"very large":1.7,"large":1.35,"big":1.35,"small":.75,"tiny":.55};
    const wRe = /\b(huge|massive|very large|large|big|small|tiny)\b([^.\n]{0,60})/g;
    while((m = wRe.exec(t))){
      const k = m[2].indexOf("flower");
      if(k < 0) continue;
      if(/leaves|leaf|plant|vine|shrub|peduncle|stem|twining|root/.test(m[2].slice(0,k))) continue;
      size = words[m[1]]; sizeSrc = (size >= 1.7 ? "very large" : m[1]) + " flowers"; break;
    }
  }
  const h = hash(p.name);
  if(count === null){
    /* not in the notes: bigger flowers come in smaller clusters */
    const s = size || 1;
    count = s >= 1.6 ? 3 + h%3 : s >= 1.3 ? 6 + h%4 : s <= .6 ? 22 + h%6 : s <= .8 ? 15 + h%6 : 10 + h%6;
  }
  count = Math.max(1, Math.min(30, count));
  return {count, size: size || 1, countSrc, sizeSrc};
}

/* the center star: five diamonds, one per arm, laid out as the outer star turned upside down.
   Each diamond starts dist out from the middle, runs len out towards its tip and is wide across
   its widest point (all as shares of the center size r). Tip and inner corner roundness, edge bulge
   and tip curl shape every diamond the same way. */
function coronaGeoms(x,y,r,rot,dist,len,wide,tTip,bulge,curl,tIn,mid,tMid){
  if(tIn == null) tIn = tTip; if(tMid == null) tMid = tIn;
  curl = curl || 0;
  const d0 = r*dist, L = Math.max(.01, r*len), d1 = d0 + L, w = r*wide, waist = d0 + L*(mid == null ? .28 : mid), out = [];

    const pt = (along, across) => [x + along*ux - across*uy, y + along*uy + across*ux];

    V.push(pt(waist, -w));      main.push(true); tipV.push(tMid);
    if(curl > .001){
      const spread = L*(.05 + curl*.11);
      V.push(pt(d1 - L*curl*.06, -spread)); main.push(false); tipV.push(true);
      V.push(pt(d1 - L*curl*.42, 0));       main.push(false); tipV.push(true);
      V.push(pt(d1 - L*curl*.06,  spread)); main.push(true);  tipV.push(true);
    } else { V.push(pt(d1, 0)); main.push(true); tipV.push(true); }
    V.push(pt(waist, w));       main.push(true); tipV.push(tMid);

function coronaPath(x,y,r,rot,dist,len,wide,tTip,bulge,curl,tIn,mid,tMid){

/* the same rounded outline as polyPath, as curve pieces for the 3D mesh to sample directly:
   each corner a quadratic through its vertex, each side the part of its (bulged) quadratic between two corners */
function polyGeom(V, main, tipV, tTip, tIn, bulge, x, y){
  const n = V.length;
  /* a corner's value: its roundness, or below 0 a pinch that draws both sides in towards it into a fine spike */
  const raw = V.map((_,k) => typeof tipV[k] === "number" ? tipV[k] : tipV[k] ? tTip : tIn);
  const C = V.map((A,k) => {
    const B = V[(k+1)%n], mx = (A[0]+B[0])/2, my = (A[1]+B[1])/2, pa = Math.max(0, -raw[k]*2), pb = Math.max(0, -raw[(k+1)%n]*2);

/* ---------- 3D flower ----------
   The flower is meshed directly from its geometry, with no 2D drawing in between:
   - The outline of one lobe comes straight from the star's corners and sides (polyGeom). Rounded corners are
     real curves, sampled adaptively: tight curves get many points, straight sides only a few.
   - Each outline point starts a column of vertices running in to the center. Rows are placed where they matter:
     evenly through the body, and packed into a band along the edge when the margins roll.
   - Margin curl rolls that band about the lobe's own edge, using each column's edge direction and distance.
   - The whole flower is one surface: the columns of all five lobes run on round the center as a single ring, so edge
     directions, normals and thickness are worked out across the sinuses exactly as anywhere else, with no seams.
   Shaping in 3D:
   - Tube shape: the middle of the corolla (inside the sinuses) cups forward (concave) or domes back (convex).
   - Lobe bend: each lobe hinges near its base, forward (inflexed) or back (reflexed).
   - Lobe curl: the bend keeps increasing towards the tip, so lobes roll up (forward) or roll under (revolute).
   - Margin curl: the edges of each lobe roll forward (involute) or back (revolute) along its length.
   Nothing passes through anything else: lobes rolling forward stop short of the center, the thickness of the corolla
   shrinks wherever the surface curls tighter than it is thick, and the corona and gynostegium sit just above the
   curved surface, lifted enough to clear the flat facets between vertices.
   The corolla's colors are flat, with its back shown a little darker; the corona and gynostegium are solids with
   a soft fixed light baked into their colors. */

  o = (o || "").trim(); if(!o) return {places: [], note: ""};
  const notes = [], keep = [];
  let main = o.replace(/\(([^)]*)\)/g, (m, inner) => { if(/^[a-z]/.test(inner.trim())){ notes.push(inner.trim()); return ""; } keep.push(inner); return "\u0001" + (keep.length - 1) + "\u0002"; });
  let tail = ""; const dot = main.search(/\.\s/); if(dot >= 0){ tail = main.slice(dot + 1).trim(); main = main.slice(0, dot); }
  const places = [];
  main.split(/,\s*|\s+and\s+/).map(x => x.replace(/\u0001(\d+)\u0002/g, (m, i) => "(" + keep[+i] + ")").replace(/\s+/g, " ").trim()).filter(Boolean)

function careText(p, hasTemp, hasHum){
  if(!p.care) return p.care;

  const leftover = seg => seg.toLowerCase().replace(/\d+(?:[.,]\d+)?/g," ").replace(/[º°%:\-–~+()]/g," ").split(/\s+/).filter(w => w && !STOP.has(w));

    let e = m; while(on.has((e%12)+1) && runs.length < 12 && (e%12)+1 !== m) e = (e%12)+1;

      /* the small ones fill the gaps (as many as fit), six are taken out for a little air, then they are evened out:
         each in turn nudges toward wherever its nearest neighbor (or the pot wall) is farthest, so the spacing evens out */
      const base = placed.length;
      place(top, h, 400, () => 1.5 + Math.pow(rnd(), 1.6)*2.9, () => "");
      for(let k = 0; k < 6 && placed.length > base; k++) placed.splice(base + Math.floor(rnd()*(placed.length - base)), 1);
      const small = placed.slice(base);
      const room = (p, x, y) => Math.min(x - x0 - p.r, x1 - x - p.r, y - top - p.r, top + h - y - p.r,
        ...placed.filter(q => q !== p).map(q => Math.hypot(x - q.x, y - q.y) - p.r - q.r));
      for(let it = 0; it < 120; it++) for(const p of small){
        const a = rnd()*Math.PI*2, d = .15 + rnd()*.6, x = p.x + Math.cos(a)*d, y = p.y + Math.sin(a)*d;
        if(room(p, x, y) > room(p, p.x, p.y)){ p.x = x; p.y = y; }
      }
      small.forEach(p => out.push(stone(p.x, p.y, p.r)));
    }
    else if(L.k === "husk")       /* husks: dark, slender grains */
      place(top, h, area/5, () => 3.25, (x,y,r,a) => `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(r)}" ry="1.1" fill="${L.color}" transform="rotate(${f(a*180/Math.PI)} ${f(x)} ${f(y)})"/>`, 1.1);
    else if(L.k === "verm")       /* vermiculite: small golden flakes */
      place(top, h, area/13, () => 1.9 + rnd()*.8, (x,y,r) => { const w = r*1.5; return `<rect x="${f(x - w/2)}" y="${f(y - w*.35)}" width="${f(w)}" height="${f(w*.7)}" rx=".6" fill="${L.color}" transform="rotate(${f(rnd()*90)} ${f(x)} ${f(y)})"/>`; });
    else if(L.k === "mulch")      /* mulch: short fibrous strands */
      place(top, h, area/4, () => 2 + rnd()*.9, (x,y,r,a) => { const dx = Math.cos(a)*r, dy = Math.sin(a)*r, bx = -Math.sin(a)*1.1, by = Math.cos(a)*1.1;
        return `<path d="M${f(x - dx)} ${f(y - dy)}Q${f(x + bx)} ${f(y + by)} ${f(x + dx)} ${f(y + dy)}" stroke="${L.color}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`; }, 1.1, 1.1);   /* lying mostly flat */
    else                          /* bark: angular chips */
      place(top, h, area/5, () => 1.5 + rnd()*.8, (x,y,r) => { const a = rnd()*Math.PI;
        const pts = [0,1.7,3.3,4.6].map(t => { const rr = r*(.8 + rnd()*.2); return f(x + Math.cos(a+t)*rr) + "," + f(y + Math.sin(a+t)*rr*.8); }).join(" ");
        return `<polygon points="${pts}" fill="${L.color}"/>`; });
    yb = top;
  }
  SOIL_SVG = `<svg class="soil-pot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Soil mix by volume: ${SOIL.map(L => L.label.toLowerCase() + " " + Math.round(L.share*100) + "%").join(", ")}">
    <defs><clipPath id="soil-clip"><path d="${smoothRect(x0, pad + ip, x1 - x0, inner, 4.5)}"/></clipPath></defs>
    <g clip-path="url(#soil-clip)">${out.join("")}</g>
    <path d="${smoothRect(ox0, pad, ox1 - ox0, H - 2*pad, 8)}" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="3.2" vector-effect="non-scaling-stroke"/></svg>`;
  return SOIL_SVG;
}
function soilKey(){
  return `<ul class="soil-key">${SOIL.slice().reverse().map(L => `<li><i style="background:${L.color}"></i>${L.label}<span>${Math.round(L.share*100)}%</span></li>`).join("")}</ul>`;
}
/* the name tile: its background is the accent a little darker and richer, and the name takes whichever of near-black
   or near-white reads best against that background (stepping a mid-tone background a touch lighter or darker until
   it reads at 4.5:1). The umbel behind is never faded */
function contrast(a, b){ const x = lum(a), y = lum(b); return (Math.max(x,y) + .05) / (Math.min(x,y) + .05); }
/* the auto accent is taken a little darker and richer, stepped until a near-black or near-white name reads at 4.5:1 on it
   (this used to be applied to the name box alone; it is now baked into the accent, so the box shows the accent as is) */
function accentForName(col){
  const [L, C, h] = OK.hexToLch(col), at = l => OK.lchToHex(l, Math.min(C*1.1 + .005, OK.maxChroma(l, h)), h);
  let L2 = Math.max(0, L - .045), bg = at(L2);
  const on = ["#16171A", "#F7F6F2"].sort((a, b) => contrast(b, bg) - contrast(a, bg))[0];
  /* mid-tone accents: step the background away from the name's color until the name passes 4.5:1 */
  const dir = on === "#16171A" ? 1 : -1;
  for(let k = 0; k < 30 && contrast(on, bg) < 4.5; k++){ L2 = Math.min(1, Math.max(0, L2 + dir*.006)); bg = at(L2); }
  return bg;
}
/* the name box: exactly the page accent picked in the builder; only the name's color is chosen, near-black or near-white,
   whichever reads better on it */
function nameColors(p, col){
  const on = ["#16171A", "#F7F6F2"].sort((a, b) => contrast(b, col) - contrast(a, col))[0];
  return {bg: col, on};
}
function renderPlant(p){
  const i = DATA.indexOf(p), prev = DATA[(i-1+DATA.length)%DATA.length], next = DATA[(i+1)%DATA.length];
  const col = accentOf(p.name);
  const t = temps(p), hu = humidity(p), sc = scent(p), f = filled(p);
  const acc = col || "var(--line)";
  const on = col ? (lum(col) > .4 ? "#16171A" : "#F7F6F2") : "var(--ink)";
  const soft = col ? `color-mix(in srgb, ${col} 26%, var(--tile))` : "var(--tile)";
  const meter = col ? (lum(col) > .6 ? mix(col,"#000000",.25) : col) : "var(--signal)";
  /* a range reads low number at the left, high number at the right, a soft pill between; the unit sits in the corner */
  const rangeNum = (a, b, unit) => `<span class="stat-unit">${unit}</span><div class="num range">${a === b ? `<span>${a}</span>` : `<span>${a}</span><i class="range-dash" aria-label="to"></i><span>${b}</span>`}</div>`;
  const tempTile = t ? `${rangeNum(t[0], t[1], "ºC")}
      <div class="meter temp"><span class="goo"><b style="left:${t[0]/40*100}%; width:${Math.max(3,(t[1]-t[0])/40*100)}%; background-size:${40/Math.max(1.2,t[1]-t[0])*100}% 100%; background-position:${40-(t[1]-t[0]) > .5 ? t[0]/(40-(t[1]-t[0]))*100 : 0}% 0"></b></span></div><div class="scale"><span>0</span><span>20</span><span>40ºC</span></div>`
    : `<div class="word none">No data</div>`;
  const humTile = hu ? `${rangeNum(hu[0], hu[1], "%")}
      <div class="meter hum"><span class="goo"><b style="left:${hu[0]}%; width:${Math.max(3,hu[1]-hu[0])}%"></b></span></div><div class="scale"><span>0</span><span>50</span><span>100%</span></div>`
    : `<div class="word none">No data</div>`;
  const scentTile = sc ? `<div class="word">${esc(sc.word)}</div><div class="sub">${esc(sc.note)}</div>` : `<div class="word none">No data</div>`;
  const links = [];
  if(p.source){
    const lbl = p.sourceLabel.replace(/^Other source:\s*/,"").split("\n")[0];
    const note = (p.sourceLabel.split("\n")[1]||"").replace(/[()]/g,"");
    links.push(`<a href="${esc(p.source)}" target="_blank" rel="noopener"><span>${esc(/^Vermont/.test(lbl)?"Vermont Hoyas page":lbl)}<small>${esc(note || (() => { try { return new URL(p.source).hostname.replace(/^www\./,""); } catch(e){ return ""; } })())}</small></span>${ARROW}</a>`);
  }
  return `
  <section class="bento" style="--acc:${acc}; --on:${on}; --acc-soft:${soft}; --acc-meter:${meter}">
    ${(() => { const n = col ? nameColors(p, col) : null; return `<div class="tile s12 name-tile"${n ? ` style="--name-bg:${n.bg}; --on:${n.on}"` : ""}>`; })()}
      <div class="name-umbel" style="--hx:${specOf(p).heroX || 0}; --hy:${specOf(p).heroY || 0}">${umbel(p, "three")}</div>
      <p class="label">No. ${String(i+1).padStart(2,"0")} of ${DATA.length} · Hoya</p>${statusIcon(p, true)}
      <h1>${esc(p.name)}</h1>
    </div>

    <div class="tile s4 art-tile">${umbel(p)}</div>   <!-- the umbel from the front, beside the bloom -->
    <div class="tile s8 notes bloom-tile"><div class="bloom-body"><div class="bloom-3d" id="bloom-3d" role="img" aria-label="One ${esc(p.name)} flower"></div><div><h2>Bloom</h2>${paragraphs(p.bloom)}</div></div></div>

    <div class="s12 stats">   <!-- the photo is shown only in the flower builder -->
    <div class="tile"><p class="stat-ico" title="Temperature">${icon("temp")}<span class="vh">Temperature</span></p>${tempTile}</div>
    <div class="tile"><p class="stat-ico" title="Humidity">${icon("humidity")}<span class="vh">Humidity</span></p>${humTile}</div>
    <div class="tile"><p class="stat-ico" title="Scent">${icon("scent")}<span class="vh">Scent</span></p>${scentTile}</div>
    ${(() => { const o = (p.origin || "").trim(), sh = originShort(p.origin), op = originPlaces(o), more = op.places.length > 1 || !!op.note;
      const ico = `<p class="stat-ico" title="Origin">${icon("origin")}<span class="vh">Origin</span></p>`;
      if(!o) return `<div class="tile">${ico}<div class="word none">No data</div></div>`;
      /* the front shows the first place; the plus flips the card over, lifts it and opens it out to every place */
      return `<div class="tile origin-tile${more ? " has-more" : ""}"><div class="oc">
        <div class="oc-face oc-front">${ico}${more ? `<button type="button" class="oc-btn" aria-expanded="false" aria-label="Show every place of origin"><i></i></button>` : ""}<div class="word fit">${esc(sh)}</div></div>
        ${more ? `<div class="oc-face oc-back" aria-hidden="true">${ico}<button type="button" class="oc-btn" aria-label="Show only the first place" tabindex="-1"><i></i></button>
          <ul class="oc-list">${op.places.map(x => `<li>${esc(x)}</li>`).join("")}</ul>${op.note ? `<p class="sub">${esc(op.note)}</p>` : ""}</div>` : ""}
      </div></div>`; })()}

    </div>

    <div class="tile s8 notes bloom-tile leaf-tile" style="--leaf:${specOf(p).leafTop || "#4A7A22"}"><div class="bloom-body"><div class="bloom-3d leaf-pair" id="leaf-pair" role="img" aria-label="A length of ${esc(p.name)} stem with its leaves"></div><div><h2>Leaves</h2>${paragraphs(p.leaves)}</div></div></div>
    <div class="tile s4 notes"><h2>${icon("care")}Care</h2>${(() => { const c = careText(p, !!t, !!hu); return p.care && !c ? `<p class="none">Only temperature and humidity, shown above</p>` : paragraphs(c); })()}</div>
    ${["light","water"].map(k=>`<div class="tile s6 notes lw-tile"><h2>${icon(k)}${k[0].toUpperCase()+k.slice(1)}</h2>${paragraphs(p[k])}</div>`).join("")}
    <div class="tile s4 notes soil-tile"><div class="soil-body"><div class="soil-potwrap">${soilPot()}</div><div class="soil-text"><h2>Soil</h2><p>Loose and airy soil mix</p>${soilKey()}</div></div></div>
    ${seasonTile(p)}
    <div class="tile s12"><p class="label">${icon("sources")}Sources</p><div class="links">${links.join("") || `<p class="none notes">No source linked</p>`}</div></div>
  </section>
  <nav class="pager" aria-label="More Hoyas">
    <a class="tile tile-link" href="#${slug(prev.name)}" style="--c:${accentOf(prev.name)}; --on:${lum(accentOf(prev.name))>.4?"#000000":"#FFFFFF"}"><span class="label">← Previous</span><span class="nm">${esc(prev.name)}</span></a>
    <a class="tile tile-link next" href="#${slug(next.name)}" style="--c:${accentOf(next.name)}; --on:${lum(accentOf(next.name))>.4?"#000000":"#FFFFFF"}"><span class="label">Next →</span><span class="nm">${esc(next.name)}</span></a>
  </nav>`;
}

/* theme */
const root = document.documentElement;
function resolvedTheme(){
  const set = root.getAttribute("data-theme");
  if(set === "dark" || set === "light") return set;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function syncThemeLabel(){
  const r = resolvedTheme(); root.dataset.resolved = r;
  document.getElementById("theme-label").textContent = r === "dark" ? "Light" : "Dark";
}
try { const t = localStorage.getItem("hoya-theme"); if(t) root.setAttribute("data-theme", t); } catch(e){}
document.getElementById("theme").addEventListener("click", () => {
  const nextTheme = resolvedTheme() === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", nextTheme);
  try { localStorage.setItem("hoya-theme", nextTheme); } catch(e){}
  syncThemeLabel();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeLabel);
new MutationObserver(syncThemeLabel).observe(root, {attributes:true, attributeFilter:["data-theme"]});

/* routing */
const view = document.getElementById("view");
let first = true;
/* origin names stay on one line: the type shrinks just enough to fit its tile, measured before the page is shown,
   and again whenever the tile changes width */
const FIT_RO = typeof ResizeObserver !== "undefined" ? new ResizeObserver(es => es.forEach(e => fitWord(e.target.querySelector(".word.fit")))) : null;
function fitWord(el){
  if(!el) return;
  el.style.fontSize = "";
  const room = el.clientWidth, need = el.scrollWidth;
  if(need > room + .5) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * room / need * .98).toFixed(2) + "px";
}
/* origin card: open measures the back's full list and grows the card to fit it; Escape or a click elsewhere closes it */
function originToggle(tile, open){
  const oc = tile.querySelector(".oc"), back = tile.querySelector(".oc-back"); if(!oc || !back) return;
  const h0 = tile.getBoundingClientRect().height;
  oc.style.setProperty("--oc-h", oc.getBoundingClientRect().height + "px");
  void oc.offsetHeight;
  if(open){ back.style.height = "auto"; back.style.bottom = "auto"; const need = back.scrollHeight; back.style.height = ""; back.style.bottom = "";
    oc.style.setProperty("--oc-h", Math.max(h0, need) + "px"); }
  else { oc.style.setProperty("--oc-h", h0 + "px"); oc.addEventListener("transitionend", function done(e){ if(e.propertyName !== "height") return; oc.removeEventListener("transitionend", done); if(!tile.classList.contains("open")) oc.style.removeProperty("--oc-h"); }); }
  tile.classList.toggle("open", open);
  const [fb, bb] = tile.querySelectorAll(".oc-btn");
  fb.setAttribute("aria-expanded", open); fb.tabIndex = open ? -1 : 0; bb.tabIndex = open ? 0 : -1;
  back.setAttribute("aria-hidden", !open); tile.querySelector(".oc-front").setAttribute("aria-hidden", open);
  (open ? bb : fb).focus({preventScroll: true});
}
document.addEventListener("click", e => {
  const b = e.target.closest(".oc-btn"); if(b){ const t = b.closest(".origin-tile"); originToggle(t, !t.classList.contains("open")); return; }
  document.querySelectorAll(".origin-tile.open").forEach(t => { if(!t.contains(e.target)) originToggle(t, false); });
});
document.addEventListener("keydown", e => { if(e.key === "Escape") document.querySelectorAll(".origin-tile.open").forEach(t => originToggle(t, false)); });
let SOIL_RO = null;
function fitSoil(){
  const t = document.querySelector(".soil-text"), w = document.querySelector(".soil-potwrap"); if(!t || !w) return;
  const set = () => w.style.setProperty("--pot-h", Math.max(116, t.getBoundingClientRect().height) + "px");
  set();
  if(window.ResizeObserver){ if(SOIL_RO) SOIL_RO.disconnect(); SOIL_RO = new ResizeObserver(set); SOIL_RO.observe(t); }
}
function fitWords(root){
  root.querySelectorAll(".word.fit").forEach(el => { fitWord(el); if(FIT_RO) FIT_RO.observe(el.parentElement); });
}
/* the single flower in the Bloom tile: a still picture at three quarters */
function mountBloom(p){
  const slot = document.getElementById("bloom-3d"); if(!slot) return;
  slot.insertAdjacentHTML("beforeend", stillImg("bloom-canvas", "stills/" + slug(p.name) + "-bloom.png", 520, null, true));
}
/* the leaves: a length of stem with its leaves, a still picture */
function mountLeaves(p){
  const slot = document.getElementById("leaf-pair"); if(!slot) return;
  slot.insertAdjacentHTML("beforeend", stillImg("bloom-canvas", "stills/" + slug(p.name) + "-leaf.png", 760, null, true));
}
function route(instant){
  if(/^#build/.test(location.hash)){ history.replaceState(null, "", "#" + location.hash.slice(1).replace(/^build-?/, "")); }
  const id = location.hash.slice(1), p = DATA.find(x => slug(x.name) === id);
  requestAnimationFrame(fitType); setTimeout(fitType, 300);   /* refit the big type once the page has drawn */
  const draw = () => {
    if(p){ view.innerHTML = renderPlant(p); fitWords(view); fitSoil(); mountBloom(p); mountLeaves(p); document.title = "Hoya " + p.name; }
    else { view.innerHTML = renderHome(); bindHome(); document.title = "Hoya Collection"; }
    document.body.dataset.page = (id === "build" || id.startsWith("build-")) ? "build" : p ? "plant" : "home";
    /* on a hoya's page the Flower builder button opens that hoya's flower */
    hydrateUmbels();   /* after the new page is in place, so its umbels are found */
  };
  if(first || instant){ draw(); first = false; return; }
  view.classList.add("leaving");
  setTimeout(() => { draw(); window.scrollTo(0,0); requestAnimationFrame(() => view.classList.remove("leaving")); }, 260);
}
/* shrink big type until its longest word fits, so names never break mid-word */
function fitType(){
  document.querySelectorAll(".hero h1, .name-tile h1, .tile-link h3, .pager .nm, .b-title").forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
    while(el.scrollWidth > el.clientWidth + 1 && size > 14 && guard++ < 60){ size -= 2; el.style.fontSize = size + "px"; }
  });
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitType);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { fitType(); }, 120); });
window.addEventListener("hashchange", () => route(false));
syncThemeLabel(); route(true);
</script>
</body>
</html>
